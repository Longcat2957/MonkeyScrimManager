[workspace]
members = ["apps/api", "apps/riot-api"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "UNLICENSED"

[workspace.dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio", "tracing", "ws"] }
base64 = "=0.22.1"
cookie = "=0.18.1"
futures-util = "=0.3.32"
governor = "=0.10.4"
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "json", "rustls"] }
redis = { version = "=1.3.0", default-features = false, features = ["tokio-comp"] }
ring = "=0.17.14"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
secrecy = { version = "=0.10.3", features = ["serde"] }
sqlx = { version = "=0.9.0", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-native-roots", "uuid"] }
thiserror = "=2.0.18"
testcontainers = "=0.27.3"
time = { version = "=0.3.53", features = ["formatting", "serde"] }
tokio = { version = "=1.52.3", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "=0.5.3", features = ["util"] }
tower-http = { version = "=0.7.0", features = ["limit"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
unicode-casefold = "=0.2.0"
unicode-normalization = "=0.1.25"
uuid = { version = "=1.23.4", features = ["serde", "v7"] }
