          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/guilds/{guildId}/auction-recruitments/{auctionRecruitmentId}/force-cancel:
    post:
      operationId: forceCancelGuildAuctionRecruitment
      summary: Force-cancel an auction recruitment from the Bot workflow
      description: >-
        Bot service-principal, active-operator recovery command. OPEN and CLOSED recruitments are
        cancelled while participant and setup history is retained. A CONVERTED recruitment delegates
        to the linked tournament cancellation transaction: BIDDING, BRACKET_SETUP, and IN_GAME are
        eligible; confirmed games are reversed newest first only when each MMR ledger is still the
        global history tail. A later MMR mutation rejects the whole command rather than partially
        cancelling. Immutable bid, action, point, and game history is never deleted. This is not a
        browser lifecycle action or a Discord recruitment-card component action.
      security:
        - BotBearer: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/AuctionRecruitmentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActorRequest'
      responses:
        '200':
          description: >-
            Cancelled recruitment, linked tournament state when applicable, or an identical
            interaction replay.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionRecruitmentForceCancelResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
