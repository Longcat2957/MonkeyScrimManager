      description: >-
        Returns the IN_PROGRESS general-series roster frozen from its entry draft, the current
        pick-ban set, and viewer-specific lifecycle capabilities for an active guild member. This
        first vertical slice returns games as an empty array and exposes a synthetic DEFAULT
        current game when no persisted draft exists; pick/ban and game-result mutations are not
        part of this endpoint.
