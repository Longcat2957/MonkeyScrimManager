        '200':
          description: Entry draft reset or an identical browser command replayed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryDraftSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Includes entry_draft_revision_conflict when expectedRevision is stale,
            entry_draft_not_editable when the recruitment is not CLOSED, or an idempotency conflict.
          headers:
            X-Request-ID:
