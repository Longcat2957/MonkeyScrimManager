  /api/guilds/{guildId}/series/{seriesId}/revert:
    post:
      operationId: revertGuildSeriesToEntryDraft
      summary: Revert an unplayed general series to its entry draft
      description: >-
        Browser-session command for a current active operator only. The expectedRevision is the
        series revision. It is accepted only while the series is IN_PROGRESS and has no confirmed
        games. The series is retained as CANCELLED for history, and its source recruitment is
        restored to CLOSED with convertedAt cleared so the existing entry draft can be edited and
        converted into a new series. The transaction writes audit and realtime outbox records
        atomically; an identical browser idempotency key replays the result.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/SeriesId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesLifecycleRequest'
      responses:
        '200':
          description: Series was cancelled and its source entry draft was restored, or an identical command was replayed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesLifecycleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Includes series_revision_conflict for a stale expectedRevision,
            series_not_in_progress when the series has already transitioned,
            series_source_not_converted when its source is no longer CONVERTED,
            series_has_confirmed_games when history must be rolled back first, or an
            idempotency_conflict.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Includes invalid_series_lifecycle_request for an invalid body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
