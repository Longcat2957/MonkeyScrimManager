          description: Authoritative IN_PROGRESS pick-ban series snapshot.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesPickBanSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The series is missing, not accessible to the active member, or is no longer IN_PROGRESS.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteGuildSeries
      summary: Cancel an unplayed general series and cancel its source recruitment
      description: >-
        Browser-session command for a current active operator only. The expectedRevision is the
        series revision. It is accepted only while the series is IN_PROGRESS and has no confirmed
        games. The series is retained as CANCELLED for history while its source recruitment is
        transitioned to CANCELLED rather than reopened. The transaction writes audit and realtime
        outbox records atomically; an identical browser idempotency key replays the result.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/SeriesId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
