  /api/guilds/{guildId}/recruitments/{recruitmentId}/reopen:
    post:
      operationId: reopenGuildRecruitmentForEntry
      summary: Reopen a closed general recruitment from entry editing
      description: >-
        Browser-session command for a current active operator only. The recruitment must be CLOSED
        and expectedRevision must equal the current recruitment revision. It changes the recruitment
        to OPEN without clearing entry assignments, returns the authoritative entry-draft snapshot,
        and queues RECRUITMENT_MESSAGE_UPDATE for a bound Discord recruitment message. This endpoint
        does not reopen CANCELLED recruitments and does not create a series. Realtime delivery keeps
        recruitment and entry-draft revisions on their respective topics.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/RecruitmentId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryDraftRevisionRequest'
      responses:
        '200':
          description: Recruitment reopened or an identical browser command replayed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryDraftSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Includes entry_draft_revision_conflict when expectedRevision is stale,
            entry_draft_not_editable when the recruitment is not CLOSED, or an idempotency conflict.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/guilds/{guildId}/recruitments/{recruitmentId}/auction-recruitment:
    post:
      operationId: createGuildAuctionRecruitmentFromEntryDraft
      summary: Convert a closed general recruitment into a 10-person auction recruitment
      description: >-
        Browser-session command for a current active operator only. The source recruitment must be
        CLOSED, expectedRevision must equal its current recruitment revision, exactly ten
        participants must be JOINED, and the source cannot already have an active series or prior
        conversion. Lane assignments are not required. The transaction creates a CLOSED
        TEN_PERSON auction recruitment with the source rules, copies the joined roster, records a
        KST expected-start label in its generated title, and atomically records audit, idempotency,
        realtime, and Discord delivery work.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/RecruitmentId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryDraftAuctionConversionRequest'
      responses:
        '201':
          description: Auction recruitment created or an identical browser command replayed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionRecruitmentSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Includes recruitment_revision_conflict for a stale expectedRevision,
            entry_draft_auction_source_not_ready when the source is not CLOSED,
            entry_draft_already_converted_to_series, recruitment_channel_not_configured, or an
            idempotency conflict.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Includes invalid_expected_start_at when expectedStartAt is absent or not an RFC 3339
            timestamp with a timezone, or entry_draft_incomplete when fewer than ten participants
            have joined.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/guilds/{guildId}/series:
    get:
      operationId: listGuildSeries
      summary: List active or completed general series
      description: >-
        Lists the requested series state ordered by updatedAt and opaque id descending. Active
        selects IN_PROGRESS; completed selects COMPLETED. A non-null nextCursor continues after
        the last returned row.
      security:
        - SessionCookie: []
      parameters:
