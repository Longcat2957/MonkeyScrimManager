openapi: 3.1.0
info:
  title: MonkeyBot API
  version: 0.1.0
  description: Axum API contract. Domain operations are added only with their vertical slice.
servers:
  - url: https://monkeybot.lol
  - url: https://dev.monkeybot.lol
paths:
  /oauth/discord/start:
    get:
      operationId: startDiscordOAuth
      summary: Start Discord OAuth authorization
      description: >-
        Creates a single-use OAuth attempt and redirects the browser to Discord. The optional
        next path must be a same-origin application path accepted by the backend allowlist.
      parameters:
        - name: next
          in: query
          required: false
          description: Allowlisted same-origin path used after a successful callback.
          schema:
            type: string
            default: /
            example: /g/123456789012345678
      responses:
        '302':
          description: Redirect to the Discord authorization endpoint.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/OAuthStateCookie'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /oauth/callback:
    get:
      operationId: completeDiscordOAuth
      summary: Complete Discord OAuth authorization
      description: >-
        Validates the single-use state and PKCE verifier, exchanges the Discord code, rotates the
        server-side session, and redirects to the allowlisted path stored with the login attempt.
      parameters:
        - name: code
          in: query
          required: false
          description: Discord authorization code. Required when Discord did not return an error.
          schema:
            type: string
            minLength: 1
            maxLength: 2048
        - name: state
          in: query
          required: true
          description: Single-use OAuth state that must match the binding cookie.
          schema:
            type: string
            minLength: 43
            maxLength: 43
        - name: error
          in: query
          required: false
          description: OAuth error returned by Discord instead of an authorization code.
          schema:
            type: string
            minLength: 1
        - name: error_description
          in: query
          required: false
          description: Optional Discord OAuth error description.
          schema:
            type: string
      responses:
        '303':
          description: >-
            Login completed. The response sets the host-only session and CSRF cookies, clears the
            OAuth state binding cookie, and redirects with GET semantics.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Location:
              $ref: '#/components/headers/RedirectLocation'
            Set-Cookie:
              $ref: '#/components/headers/AuthenticatedSessionCookies'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      description: >-
        Revokes the PostgreSQL session and expires both browser authentication cookies. The
        X-CSRF-Token value must equal the monkeybot_csrf cookie value.
      security:
        - SessionCookie: []
          CsrfHeader: []
      responses:
        '200':
          description: Session revoked and browser cookies expired.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
            Set-Cookie:
              $ref: '#/components/headers/ClearedSessionCookies'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me:
    get:
      operationId: getCurrentUser
      summary: Get the authenticated user
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Current user and root redirect context.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me/privacy:
    get:
      operationId: getCurrentUserPrivacySettings
      summary: Get the current user's privacy settings
      description: >-
        Returns the stored settings for the authenticated user. If no settings row exists, the
        server returns the defaults publicProfile=true, showRiotIds=true, and
        allowExternalRecordSearch=false without creating a row.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authoritative privacy settings snapshot.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettingsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateCurrentUserPrivacySettings
      summary: Replace the current user's privacy settings
      description: >-
        Atomically stores all three privacy settings and returns the authoritative post-commit
        snapshot. The X-CSRF-Token value must equal the monkeybot_csrf cookie value.
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivacySettings'
      responses:
        '200':
          description: Privacy settings replaced.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivacySettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me/champion-preferences:
    get:
      operationId: getCurrentUserChampionPreferences
      summary: Get all champion preferences for the current user
      description: >-
        Returns all five canonical lanes. A lane without stored rows is represented by an empty
        array, and champion IDs retain the user's explicit order.
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Authoritative champion preference snapshot for all lanes.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampionPreferencesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me/champion-preferences/{lane}:
    put:
      operationId: replaceCurrentUserChampionPreferences
      summary: Replace one lane's ordered champion preferences
      description: >-
        Atomically replaces the selected lane. An empty championIds array clears that lane. The
        response is the complete post-commit five-lane snapshot, not only the changed lane.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/ChampionPreferenceLane'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceChampionPreferencesRequest'
      responses:
        '200':
          description: Lane replaced and the authoritative full snapshot returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChampionPreferencesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me/guilds:
    get:
      operationId: listCurrentUserGuilds
      summary: List guilds accessible to the authenticated user
      security:
        - SessionCookie: []
      responses:
        '200':
          description: Active guild memberships with the current role in each guild.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeGuildsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/me/default-guild:
    put:
      operationId: updateDefaultGuild
      summary: Update the authenticated user's default guild
      description: >-
        The selected guild must be an active guild membership. The X-CSRF-Token value must equal
        the monkeybot_csrf cookie value.
      security:
        - SessionCookie: []
          CsrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDefaultGuildRequest'
      responses:
        '200':
          description: Default guild updated.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DefaultGuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/guilds/{guildId}/setup:
    post:
      operationId: setupGuildFromDiscord
      summary: Set up a guild from its first Discord interaction
      description: >-
        Bot-only first-run command. It is accepted only while the installed guild is
        INSTALLED or SETUP_REQUIRED and has no guild_config row. It creates the Discord actor,
        guild membership, operator configuration, first active season, and counters in one
        transaction. Replaying the same interaction key and request returns the stored response;
        a new interaction after setup returns 409 guild_already_configured and does not rename or
        otherwise update the existing guild.
      security:
        - BotBearer: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetupGuildRequest'
      responses:
        '200':
          description: Guild setup completed or replayed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetupGuildResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/guilds/{guildId}/registrations:
    post:
      operationId: registerGuildMemberFromDiscord
      summary: Register the current Discord user and Riot account in a guild
      description: >-
        Bot-only /등록 command for the interaction actor. The backend first performs an
        idempotency and guild-eligibility preflight, resolves the supplied Riot ID through Riot,
        and then atomically creates or reuses the global Discord user, guild membership, and
        PUUID-owned Riot account link. Display names are snapshots, never identity keys. A
        repeated registration can return EXISTING independently for the membership and account
        link; an INACTIVE membership is never reactivated implicitly.
      security:
        - BotBearer: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterGuildMemberRequest'
      responses:
        '200':
          description: Guild membership and Riot account link were atomically created or reused.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterGuildMemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/guilds/{guildId}/discord-catalog:
    put:
      operationId: replaceGuildDiscordCatalog
      summary: Replace the guild Discord role and channel catalog
      description: >-
        Bot service-principal projection that atomically replaces the complete Discord catalog
        used by guild settings. This is not a Discord interaction command and does not use an
        Idempotency-Key. Channels are limited to text or announcement channels where the Bot can
        view and send messages.
      security:
        - BotBearer: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceGuildDiscordCatalogRequest'
      responses:
        '200':
          description: Discord catalog replaced and its authoritative sync time returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscordCatalogSyncResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/notifications/claim:
    post:
      operationId: claimBotNotifications
      summary: Claim pending Bot notification deliveries
      description: >-
        Bot worker-only lease claim. It returns available rows or expired leases and increments
        attempts atomically. The lease lasts 30 seconds; a row is terminal after eight attempts.
      security:
        - BotBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimBotNotificationsRequest'
      responses:
        '200':
          description: Claimed notifications, possibly empty.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimBotNotificationsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/notifications/ack:
    post:
      operationId: acknowledgeBotNotification
      summary: Acknowledge a generic Bot notification delivery
      description: >-
        Marks a notification delivered only when instanceId and leaseToken still own the current
        lease. This route is for delivery types without a domain-specific acknowledgement side
        effect. RECRUITMENT_MESSAGE_UPDATE, RECRUITMENT_MESSAGE_DELETE,
        ENTRY_CONFIRMATION_CREATE, and SERIES_RESULT_CREATE use it after Discord delivery
        succeeds; browser-created initial recruitment messages use recruitment-message/ack instead.
      security:
        - BotBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeBotNotificationRequest'
      responses:
        '200':
          description: Delivery acknowledged.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgeBotNotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: >-
            RECRUITMENT_MESSAGE_CREATE must use the typed recruitment-message acknowledgement
            endpoint so the sent Discord message is bound atomically.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/notifications/recruitment-message/ack:
    post:
      operationId: acknowledgeRecruitmentMessageDelivery
      summary: Acknowledge and bind a queued recruitment message
      description: >-
        Only accepts RECRUITMENT_MESSAGE_CREATE. In one transaction it marks the leased delivery
        as delivered and binds the supplied Discord message ID to its recruitment. Workers must
        call this after channel.send succeeds instead of calling generic ack and the public bind
        route separately. If an add or cancel committed before the bind, the same transaction
        enqueues the required follow-up UPDATE or DELETE delivery from the latest recruitment
        snapshot.
      security:
        - BotBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeBotNotificationRequest'
      responses:
        '200':
          description: Delivery acknowledged and recruitment message reference bound.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgeRecruitmentMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/notifications/nack:
    post:
      operationId: rejectBotNotificationDelivery
      summary: Record a Bot notification delivery failure
      description: >-
        Applies the backend retry policy to a currently leased notification. HTTP 429/5xx and
        transport failures are retried with bounded backoff; ordinary HTTP 4xx and
        DELIVERY_UNKNOWN become terminal failures.
      security:
        - BotBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NackBotNotificationRequest'
      responses:
        '200':
          description: Retry scheduled or delivery failure made terminal.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NackBotNotificationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/guilds/{guildId}:
    get:
      operationId: getGuildContext
      summary: Get guild layout context
      description: >-
        Requires an active membership in the requested guild. Missing guilds and guilds outside
        the current user's tenant scope both return 404.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Guild metadata, current role, and active season.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildContextResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/guilds/{guildId}/members:
    get:
      operationId: listGuildAdminMembers
      summary: Get the guild member administration snapshot
      description: >-
        Requires an active operator membership in the requested active guild. Returns the complete
        authoritative MEMBERS admin snapshot used for revision-checked member mutations.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Current authoritative guild member administration snapshot.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildAdminMembersResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/guilds/{guildId}/settings:
    get:
      operationId: getGuildAdminSettings
      summary: Get the guild administration settings snapshot
      description: >-
        Requires an active operator membership in the requested active guild. Returns the stored
        guild settings, revision metadata, catalog sync time, selectable non-managed roles, and
        Bot-postable Discord channels in one repeatable-read snapshot. A configured resource may
        be absent from the current catalog after it is deleted in Discord.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
      responses:
        '200':
          description: Current authoritative guild settings and Discord catalog snapshot.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildAdminSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      operationId: updateGuildAdminSettings
      summary: Replace guild administration settings
      description: >-
        Requires an active operator membership, an exact CSRF cookie/header match, and the current
        guild_config revision. Changed role and non-null channel selections must exist in the
        current selectable Discord catalog. Unchanged configured IDs may remain when a later
        catalog no longer contains them. The accepted mutation increments the revision, appends a
        GUILD_SETTINGS_UPDATED audit row, and returns the complete post-commit snapshot. Season
        fields are not part of this strict request.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGuildAdminSettingsRequest'
      responses:
        '200':
          description: Guild settings replaced and the authoritative full snapshot returned.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildAdminSettingsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/guilds/{guildId}/seasons:
    get:
      operationId: getGuildAdminSeasons
      summary: Get current and completed guild seasons
      description: >-
        Requires an active operator membership in the requested active guild. Returns the current
