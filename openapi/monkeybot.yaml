            application/json:
              schema:
                $ref: '#/components/schemas/SeriesListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createGuildSeriesFromEntryDraft
      summary: Start a BO3 general series from a completed entry draft
      description: >-
        Browser-session command for a current active operator only. The source recruitment must be
        CLOSED, expectedRevision must equal its current recruitment revision, and exactly ten
        JOINED participants must occupy the ten distinct TEAM_1/TEAM_2 lane slots. The transaction
        creates an IN_PROGRESS best-of-three series, captures each participant's source-season lane
        MMR (initializing an absent row at 1500), changes the source recruitment to CONVERTED, and
        records audit, idempotency, and realtime outbox work atomically.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSeriesFromEntryDraftRequest'
      responses:
        '201':
          description: Series started or an identical browser command replayed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesCreationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Includes recruitment_revision_conflict when expectedRevision is stale,
            series_source_not_ready when the source is not CLOSED, or an idempotency conflict.
