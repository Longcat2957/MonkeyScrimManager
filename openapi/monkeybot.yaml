            series_not_in_progress when the series has already transitioned,
            series_source_not_converted when its source is no longer CONVERTED,
            series_has_confirmed_games when history must be rolled back first, or an
            idempotency_conflict.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Includes invalid_series_lifecycle_request for an invalid body.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
