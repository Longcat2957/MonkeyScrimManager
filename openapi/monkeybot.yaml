          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/guilds/{guildId}/recruitments/{recruitmentId}:
    get:
      operationId: getGuildRecruitment
      summary: Get a general recruitment snapshot
      description: >-
        Returns the authoritative recruitment roster for the entry recruitment stage. OPEN
        recruitments remain in Discord participant collection; CLOSED recruitments expose the
        entry composition link in the returned snapshot. CANCELLED recruitments remain available
        by exact ID so an eligible creator or operator can restore retained participants and entry
        assignments; they stay absent from the actionable list.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/RecruitmentId'
      responses:
        '200':
          description: General recruitment snapshot.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruitmentSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: cancelGuildRecruitment
      summary: Soft-cancel an open or closed general recruitment
      description: >-
        Browser-only optimistic soft-cancel command. The creator or a current active operator can
        transition an OPEN or CLOSED recruitment to CANCELLED when expectedRevision is current.
        Participants, entry assignments, and entry-draft history are retained. The exact detail
        remains readable for recovery while actionable-list and entry-draft reads hide the row. An
        identical browser idempotency key replays the resulting CANCELLED snapshot. A bound Discord
        recruitment message queues RECRUITMENT_MESSAGE_DELETE in the same transaction.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/RecruitmentId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruitmentLifecycleRevisionRequest'
      responses:
        '200':
          description: Recruitment cancelled or an identical browser command replayed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruitmentSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/guilds/{guildId}/recruitments/{recruitmentId}/restore:
    post:
      operationId: restoreGuildRecruitment
      summary: Restore a soft-cancelled general recruitment
      description: >-
        Browser-only recovery command for the creator or a current active operator. The recruitment
        must be CANCELLED and expectedRevision must be current. The server restores CLOSED when the
        recruitment had reached entry editing before cancellation, otherwise OPEN. Participant and
        entry data are preserved, cancellation/conversion markers are cleared, and a replacement
        Discord recruitment message is queued without reapplying any cancelled game or MMR result.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/RecruitmentId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecruitmentLifecycleRevisionRequest'
      responses:
        '200':
          description: Recruitment restored to its safe prior stage or replayed idempotently.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruitmentSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/guilds/{guildId}/recruitments/{recruitmentId}/message:
    put:
      operationId: bindGuildRecruitmentMessage
      summary: Bind the Discord recruitment message
      description: >-
        Stores the Discord channel and message snowflakes after the initial slash-command reply.
