      summary: List actionable general recruitments
      description: >-
        Lists open or closed, unconverted general recruitments ordered by updatedAt and opaque id
        descending. OPEN rows represent the entry recruitment stage; CLOSED rows are ready for
        entry composition. A non-null nextCursor continues after the last returned row.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/ActionableState'
        - $ref: '#/components/parameters/PageCursor'
        - $ref: '#/components/parameters/PageLimit'
      responses:
        '200':
          description: Actionable general recruitments.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruitmentListResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
