                    SUPPORT: []
                  riotAccounts:
                    - platform: KR
                      gameName: Longcat
                      tagLine: KR1
                      profileIconId: 588
                      isMain: true
                meta:
                  requestId: 01900000-0000-7000-8000-000000000001
