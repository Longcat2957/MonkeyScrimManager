            oneOf:
              - $ref: '#/components/schemas/SeriesPickBanChampionId'
              - type: 'null'
        bans:
          $ref: '#/components/schemas/SeriesPickBanBans'
        patchVersion:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 32
            - type: 'null'
    SeriesPickBanSeries:
      type: object
      additionalProperties: false
      required:
        - id
        - displayNumber
        - title
        - bestOf
        - status
        - revision
        - sourceRecruitmentId
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/SeriesId'
        displayNumber:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 100
        bestOf:
          type: integer
          minimum: 1
          maximum: 5
        status:
          type: string
