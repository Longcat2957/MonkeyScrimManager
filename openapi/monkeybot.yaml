      required: [id, title, status, targetCount, joinedCount, remainingSlots, revision]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        status:
          $ref: '#/components/schemas/DummyRecruitmentStatus'
        targetCount:
          type: integer
          format: int32
          minimum: 1
        joinedCount:
          type: integer
          format: int64
          minimum: 0
        remainingSlots:
          type: integer
          format: int64
          minimum: 0
        revision:
          type: integer
          format: int64
          minimum: 0
    DummyRecruitmentCandidate:
      type: object
      additionalProperties: false
      required:
        - userId
        - displayName
        - mainLane
        - profileState
        - membershipStatus
        - participationState
      properties:
        userId:
          $ref: '#/components/schemas/DummyUserIdentifier'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        mainLane:
          oneOf:
            - $ref: '#/components/schemas/Lane'
            - type: 'null'
        profileState:
          $ref: '#/components/schemas/DummyUserState'
        membershipStatus:
          $ref: '#/components/schemas/GuildMemberStatus'
        participationState:
          $ref: '#/components/schemas/DummyParticipationState'
    DummyRecruitmentOverview:
      type: object
      additionalProperties: false
      required: [recruitment, candidates]
      properties:
        recruitment:
          $ref: '#/components/schemas/DummyRecruitmentSummary'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/DummyRecruitmentCandidate'
    DummyRecruitmentAction:
      type: string
      enum: [ADD, REMOVE]
    PreviewDummyRecruitmentParticipantsRequest:
      type: object
      additionalProperties: false
      required: [action, userIds]
      properties:
        action:
          $ref: '#/components/schemas/DummyRecruitmentAction'
        userIds:
          type: array
          description: Invalid size or duplicates are reported in the preview issues.
          items:
            $ref: '#/components/schemas/DummyUserIdentifier'
    ApplyDummyRecruitmentParticipantsRequest:
      type: object
      additionalProperties: false
      required: [userIds, expectedRevision]
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DummyUserIdentifier'
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    DummyRecruitmentPreviewIssue:
      type: object
      additionalProperties: false
      required: [userId, code, message]
      properties:
        userId:
          oneOf:
            - $ref: '#/components/schemas/DummyUserIdentifier'
            - type: 'null'
        code:
          type: string
          minLength: 1
        message:
          type: string
          minLength: 1
    DummyRecruitmentPreview:
      type: object
      additionalProperties: false
      required:
        - action
        - canApply
        - currentRevision
        - projectedJoinedCount
        - remainingSlots
        - selected
        - issues
      properties:
        action:
          $ref: '#/components/schemas/DummyRecruitmentAction'
        canApply:
          type: boolean
        currentRevision:
          type: integer
          format: int64
          minimum: 0
        projectedJoinedCount:
          type: integer
          format: int64
          minimum: 0
        remainingSlots:
          type: integer
          format: int64
          minimum: 0
        selected:
          type: array
          items:
            $ref: '#/components/schemas/DummyRecruitmentCandidate'
        issues:
          type: array
          items:
            $ref: '#/components/schemas/DummyRecruitmentPreviewIssue'
    DummyRecruitmentApplyData:
      type: object
      additionalProperties: false
      required: [action, changedUserIds, overview]
      properties:
        action:
          $ref: '#/components/schemas/DummyRecruitmentAction'
        changedUserIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            $ref: '#/components/schemas/DummyUserIdentifier'
        overview:
          $ref: '#/components/schemas/DummyRecruitmentOverview'
    DummyRecruitmentOverviewResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/DummyRecruitmentOverview'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DummyRecruitmentPreviewResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/DummyRecruitmentPreview'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DummyRecruitmentApplyResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/DummyRecruitmentApplyData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    LivenessData:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          const: ok
    LivenessResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/LivenessData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ComponentStatus:
      type: string
      enum: [available, unavailable, not_configured]
    DependencySnapshot:
      type: object
      additionalProperties: false
      required: [postgres, migration, valkey]
      properties:
        postgres:
          $ref: '#/components/schemas/ComponentStatus'
        migration:
          $ref: '#/components/schemas/ComponentStatus'
        valkey:
          $ref: '#/components/schemas/ComponentStatus'
    ReadinessData:
      type: object
      additionalProperties: false
      required: [status, acceptingRequests, dependencies]
      properties:
        status:
          type: string
          enum: [ready, degraded, not_ready]
        acceptingRequests:
          type: boolean
        dependencies:
          $ref: '#/components/schemas/DependencySnapshot'
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ReadinessData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ErrorBody:
      type: object
      additionalProperties: false
      required: [code, message, requestId]
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
          format: uuid
        details: {}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
