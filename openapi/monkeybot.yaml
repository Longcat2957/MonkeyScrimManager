  /api/guilds/{guildId}/recruitments/{recruitmentId}/entry-draft:
    get:
      operationId: getGuildRecruitmentEntryDraft
      summary: Get an authoritative general-recruitment entry draft
      description: >-
        Returns the entry-draft snapshot for an active guild member. The snapshot includes the
        current recruitment and draft revisions, participant data, assignments, and viewer-specific
        capability hints. It is the source of truth for the Web entry-composition route. Only OPEN
        and CLOSED recruitments are visible; a CANCELLED recruitment returns 404.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/RecruitmentId'
      responses:
        '200':
          description: Authoritative entry-draft snapshot.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntryDraftSnapshotResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateGuildRecruitmentEntryDraft
      summary: Move one participant in a closed general-recruitment entry draft
      description: >-
        Browser-session command for a current active operator only. The recruitment must be CLOSED
        and expectedRevision must equal the current draft revision. MOVE_PARTICIPANT uses server-side
        slot swap rules: moving into an occupied slot exchanges the two assigned players; moving a
        candidate into an occupied slot returns that occupant to the candidate pool. A null slot
        moves the participant to the candidate pool. The response is the authoritative snapshot.
        Its realtime invalidate uses the recruitment-entry-draft topic and the draft revision, not
        the recruitment topic or recruitment revision.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/RecruitmentId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
      requestBody:
        required: true
