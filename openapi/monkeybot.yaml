      summary: Start a BO3 general series from a completed entry draft
      description: >-
        Browser-session command for a current active operator only. The source recruitment must be
        CLOSED, expectedRevision must equal its current recruitment revision, and exactly ten
        JOINED participants must occupy the ten distinct TEAM_1/TEAM_2 lane slots. The transaction
        creates an IN_PROGRESS best-of-three series, captures each participant's source-season lane
        MMR (initializing an absent row at 1500), changes the source recruitment to CONVERTED, and
        records audit, idempotency, and realtime outbox work atomically.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
