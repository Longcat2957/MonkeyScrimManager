      type: object
      additionalProperties: false
      required: [series, teams, currentGame, games, capabilities]
      description: >-
        The frozen roster contains exactly two teams of five unique users. currentGame.picks has
        exactly one key for each roster user. Persisted game history is intentionally unavailable
        in this first pick-ban vertical slice, so games is always an empty array.
