        user_privacy_settings: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        user_champion_preferences: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        riot_accounts: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        dummy_user_profiles: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        guild_members: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        user_guild_preferences: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        guild_counters: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        seasons: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        recruitments: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        recruitment_participants: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        recruitment_preferred_lanes: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        recruitment_entry_drafts: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        recruitment_entry_assignments: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        series: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        series_participants: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_recruitments: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_recruitment_participants: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_setup_drafts: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_setup_teams: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_tournaments: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_teams: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_bid_candidates: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_lots: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_actions: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_team_members: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_point_ledger: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_bracket_slots: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_matches: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        auction_match_lineups: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        game_inputs: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        game_input_picks: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        game_input_bans: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        games: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        game_participants: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        game_participant_stats: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        game_bans: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        user_lane_mmr: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        mmr_ledger_entries: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
        admin_audit_log: { $ref: '#/components/schemas/GuildFullSnapshotRows' }
    GuildFullSnapshotArchive:
      type: object
      additionalProperties: false
      required: [format, kind, schemaVersion, exportedAt, source, tables]
      properties:
        format:
          const: MONKEYBOT_DATA_TRANSFER
        kind:
          const: GUILD_FULL_SNAPSHOT
        schemaVersion:
          const: 1
        exportedAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/GuildFullSnapshotSource'
        tables:
          $ref: '#/components/schemas/GuildFullSnapshotTables'
    GuildFullDataSummary:
      type: object
      additionalProperties: false
      required:
        - totalRows
        - users
        - members
        - seasons
        - recruitments
        - series
        - games
        - auctionTournaments
        - auctionMatches
        - mmrLedgerEntries
        - auditEntries
      properties:
        totalRows: { type: integer, minimum: 0 }
        users: { type: integer, minimum: 0 }
        members: { type: integer, minimum: 0 }
        seasons: { type: integer, minimum: 0 }
        recruitments: { type: integer, minimum: 0 }
        series: { type: integer, minimum: 0 }
        games: { type: integer, minimum: 0 }
        auctionTournaments: { type: integer, minimum: 0 }
        auctionMatches: { type: integer, minimum: 0 }
        mmrLedgerEntries: { type: integer, minimum: 0 }
        auditEntries: { type: integer, minimum: 0 }
    GuildFullDataExportData:
      type: object
      additionalProperties: false
      required: [archive, fileName, summary]
      properties:
        archive:
          $ref: '#/components/schemas/GuildFullSnapshotArchive'
        fileName:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9._-]*\.json$'
        summary:
          $ref: '#/components/schemas/GuildFullDataSummary'
    GuildFullDataExportResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/GuildFullDataExportData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    GuildFullDataPreviewRequest:
      type: object
      additionalProperties: false
      required: [archive]
      properties:
        archive:
          $ref: '#/components/schemas/GuildFullSnapshotArchive'
    GuildFullDataIssue:
      type: object
      additionalProperties: false
      required: [reason, message, table, rowCount]
      properties:
        reason:
          type: string
        message:
          type: string
        table:
          oneOf:
            - type: string
            - type: 'null'
        rowCount:
          type: integer
          minimum: 0
    GuildFullDataPreviewData:
      type: object
      additionalProperties: false
      required:
        [
          importId,
          digest,
          targetDigest,
          expiresAt,
          source,
          summary,
          conflicts,
          remapsSourceGuild,
          usesTargetActiveSeason,
          rebasesDisplayNumbers
        ]
      properties:
        importId:
          type: string
          format: uuid
        digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        targetDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        expiresAt:
          type: string
          format: date-time
        source:
          $ref: '#/components/schemas/GuildFullSnapshotSource'
        summary:
          $ref: '#/components/schemas/GuildFullDataSummary'
        conflicts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/GuildFullDataIssue'
        remapsSourceGuild:
          type: boolean
          description: Whether archive guild references will be remapped from the source guild ID to the target path guild ID.
        usesTargetActiveSeason:
          type: boolean
          description: Whether archive rows from its active season will use the target guild's existing active season.
        rebasesDisplayNumbers:
          type: boolean
          description: Whether imported recruitment, series, or auction display numbers will be appended after existing target history.
    GuildFullDataPreviewResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/GuildFullDataPreviewData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    GuildFullDataApplyRequest:
      type: object
      additionalProperties: false
      required: [expectedDigest, expectedTargetDigest]
      properties:
        expectedDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        expectedTargetDigest:
          type: string
          pattern: '^[a-f0-9]{64}$'
    GuildFullDataApplyData:
      type: object
      additionalProperties: false
      required:
        [
          importId,
          status,
          appliedAt,
          summary,
          remappedSourceGuild,
          usedTargetActiveSeason,
          rebasedDisplayNumbers
        ]
      properties:
        importId:
          type: string
          format: uuid
        status:
          const: APPLIED
        appliedAt:
          type: string
          format: date-time
        summary:
          $ref: '#/components/schemas/GuildFullDataSummary'
        remappedSourceGuild:
          type: boolean
          description: Whether archive guild references were remapped to the target path guild ID.
        usedTargetActiveSeason:
          type: boolean
          description: Whether archive rows from its active season were mapped to the target active season.
        rebasedDisplayNumbers:
          type: boolean
          description: Whether imported recruitment, series, or auction display numbers were appended after existing target history.
    GuildFullDataApplyResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/GuildFullDataApplyData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DiscordSnowflake:
      type: string
      pattern: '^[1-9][0-9]{0,19}$'
      maxLength: 20
      description: Canonical unsigned decimal value not greater than 18446744073709551615.
      example: '123456789012345678'
    DummyUserIdentifier:
      type: string
      pattern: '^dmy_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Backend-generated development dummy identity using a lowercase RFC 4122 UUIDv7.
      example: dmy_01900000-0000-7000-8000-000000000001
    UserIdentifier:
      description: Opaque stored user ID. Clients must not infer permissions or provider behavior from it.
      oneOf:
        - $ref: '#/components/schemas/DiscordSnowflake'
        - $ref: '#/components/schemas/DummyUserIdentifier'
    UserIdentityKind:
      type: string
      enum: [DISCORD, DUMMY]
    Lane:
      type: string
      enum: [TOP, JUNGLE, MID, BOTTOM, SUPPORT]
    DiscordActor:
      type: object
      additionalProperties: false
      required: [id, globalDisplayName, displayName, avatarHash, roleIds]
      properties:
        id:
          $ref: '#/components/schemas/DiscordSnowflake'
        globalDisplayName:
          type: string
          minLength: 1
          maxLength: 100
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        avatarHash:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        roleIds:
          type: array
          items:
            $ref: '#/components/schemas/DiscordSnowflake'
    SetupGuildRequest:
      type: object
      additionalProperties: false
      required:
        - actor
        - guildName
        - guildIconHash
        - operatorRoleId
        - recruitmentChannelId
        - entryChannelId
        - resultChannelId
        - logChannelId
        - seasonName
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        guildName:
          type: string
          minLength: 1
          maxLength: 100
        guildIconHash:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        operatorRoleId:
          $ref: '#/components/schemas/DiscordSnowflake'
        recruitmentChannelId:
          $ref: '#/components/schemas/DiscordSnowflake'
        entryChannelId:
          oneOf:
            - $ref: '#/components/schemas/DiscordSnowflake'
            - type: 'null'
        resultChannelId:
          oneOf:
            - $ref: '#/components/schemas/DiscordSnowflake'
            - type: 'null'
        logChannelId:
          oneOf:
            - $ref: '#/components/schemas/DiscordSnowflake'
            - type: 'null'
        seasonName:
          type: string
          minLength: 1
          maxLength: 100
    SetupGuildCurrentSeason:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
    SetupGuild:
      type: object
      additionalProperties: false
      required: [id, displayName, operatorRoleId, currentSeason, dashboardHref]
      properties:
        id:
          $ref: '#/components/schemas/DiscordSnowflake'
        displayName:
          type: string
          minLength: 1
        operatorRoleId:
          $ref: '#/components/schemas/DiscordSnowflake'
        currentSeason:
          $ref: '#/components/schemas/SetupGuildCurrentSeason'
        dashboardHref:
          type: string
          format: uri-reference
          pattern: '^/g/'
    SetupGuildData:
      type: object
      additionalProperties: false
      required: [guild]
      properties:
        guild:
          $ref: '#/components/schemas/SetupGuild'
    SetupGuildResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SetupGuildData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RegisterGuildMemberRequest:
      type: object
      additionalProperties: false
      required: [actor, gameName, tagLine, platform]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        gameName:
          $ref: '#/components/schemas/RiotGameName'
        tagLine:
          $ref: '#/components/schemas/RiotTagLine'
        platform:
          $ref: '#/components/schemas/RiotPlatform'
    RegistrationState:
      type: string
      enum: [CREATED, EXISTING]
    RegisteredGuildMember:
      type: object
      additionalProperties: false
      required: [id, displayName, status]
      properties:
        id:
          $ref: '#/components/schemas/DiscordSnowflake'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          const: ACTIVE
    RegisteredRiotAccount:
      type: object
      additionalProperties: false
      required: [puuid, gameName, tagLine, platform, isMain]
      properties:
        puuid:
          $ref: '#/components/schemas/RiotPuuidValue'
        gameName:
          $ref: '#/components/schemas/RiotGameName'
        tagLine:
          $ref: '#/components/schemas/RiotTagLine'
        platform:
          $ref: '#/components/schemas/RiotPlatform'
        isMain:
          type: boolean
    RegisterGuildMemberData:
      type: object
      additionalProperties: false
      required: [member, riotAccount, registration, accountLink]
      properties:
        member:
          $ref: '#/components/schemas/RegisteredGuildMember'
        riotAccount:
          $ref: '#/components/schemas/RegisteredRiotAccount'
        registration:
          $ref: '#/components/schemas/RegistrationState'
        accountLink:
          $ref: '#/components/schemas/RegistrationState'
    RegisterGuildMemberResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/RegisterGuildMemberData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DiscordCatalogRoleInput:
      type: object
      additionalProperties: false
      required: [id, name, position, managed]
      properties:
        id:
          $ref: '#/components/schemas/DiscordSnowflake'
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Leading and trailing whitespace is removed before storage.
        position:
          type: integer
          format: int32
          minimum: 0
        managed:
          type: boolean
    DiscordCatalogChannelKind:
      type: string
      enum: [TEXT, ANNOUNCEMENT]
    DiscordCatalogChannelInput:
      type: object
      additionalProperties: false
      required: [id, name, parentName, position, kind]
      properties:
        id:
          $ref: '#/components/schemas/DiscordSnowflake'
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Leading and trailing whitespace is removed before storage.
        parentName:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: 'null'
        position:
          type: integer
          format: int32
          minimum: 0
        kind:
          $ref: '#/components/schemas/DiscordCatalogChannelKind'
    ReplaceGuildDiscordCatalogRequest:
      type: object
      additionalProperties: false
      required: [roles, channels]
      properties:
        roles:
          type: array
          maxItems: 250
          description: Role IDs must be unique and must not contain the guild's @everyone role.
          items:
            $ref: '#/components/schemas/DiscordCatalogRoleInput'
        channels:
          type: array
          maxItems: 500
          description: Channel IDs must be unique within the replacement snapshot.
          items:
            $ref: '#/components/schemas/DiscordCatalogChannelInput'
    DiscordCatalogSyncData:
      type: object
      additionalProperties: false
      required: [syncedAt]
      properties:
        syncedAt:
          type: string
          format: date-time
    DiscordCatalogSyncResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/DiscordCatalogSyncData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CreateRecruitmentRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        bestOf:
          type: integer
          enum: [1, 3, 5]
          default: 3
        hardFearless:
          type: boolean
          default: true
    WebCreateRecruitmentRequest:
      type: object
      additionalProperties: false
      description: >-
        The authenticated session supplies the actor; callers cannot choose another user.
        Omitted compatibility values use BO3 and hardFearless=true.
      properties:
        bestOf:
          type: integer
          enum: [1, 3, 5]
          default: 3
        hardFearless:
          type: boolean
          default: true
    CreateAuctionRecruitmentRequest:
      type: object
      additionalProperties: false
      required: [actor, format, expectedStartAt]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        format:
          $ref: '#/components/schemas/AuctionFormat'
        semifinalBestOf:
          oneOf:
            - $ref: '#/components/schemas/AuctionBestOf'
            - type: 'null'
          description: Must be non-null for TWENTY_PERSON and null for TEN_PERSON. Omitted compatibility values default to BO3 for TWENTY_PERSON.
        finalBestOf:
          $ref: '#/components/schemas/AuctionBestOf'
          default: 3
        hardFearless:
          type: boolean
          default: true
        expectedStartAt:
          type: string
          format: date-time
          description: >-
            Required RFC 3339 expected start time with an explicit timezone offset. The server
            stores a Korea Standard Time (KST) display label in the generated recruitment title.
    WebCreateAuctionRecruitmentRequest:
      type: object
      additionalProperties: false
      required: [format, expectedStartAt]
      description: >-
        The authenticated session supplies the actor. Browser callers select the auction format
        and match rules but cannot choose a Discord user, capacity, season, display number, or channel.
      properties:
        format:
          $ref: '#/components/schemas/AuctionFormat'
        semifinalBestOf:
          oneOf:
            - $ref: '#/components/schemas/AuctionBestOf'
            - type: 'null'
          description: Must be non-null for TWENTY_PERSON and null for TEN_PERSON. Omitted compatibility values default to BO3 for TWENTY_PERSON.
        finalBestOf:
          $ref: '#/components/schemas/AuctionBestOf'
          default: 3
        hardFearless:
          type: boolean
          default: true
        expectedStartAt:
          type: string
          format: date-time
          description: >-
            Required RFC 3339 expected start time with an explicit timezone offset. The server
            stores a Korea Standard Time (KST) display label in the generated recruitment title.
    WebCloseAuctionRecruitmentRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: >-
        Empty browser request body. The authenticated session supplies the actor; only a current
        active operator can close a full auction recruitment.
    AuctionRecruitmentMemberRequest:
      type: object
      additionalProperties: false
      required: [actor]
      description: >-
        Bot roster command. Omit member for actor self-service participation. Supply a distinct
        member Discord snapshot only when actor is a configured operator; declaredLane applies to
        the actual participant and otherwise falls back to that participant's stored guild main
        lane.
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        member:
          $ref: '#/components/schemas/DiscordActor'
        declaredLane:
          $ref: '#/components/schemas/Lane'
    AuctionRecruitmentForceCancelResult:
      type: object
      additionalProperties: false
      required:
        - recruitmentId
        - recruitmentStatus
        - recruitmentRevision
        - tournamentId
        - tournamentStatus
        - tournamentRevision
        - reversedGameCount
      description: >-
        tournamentId, tournamentStatus, and tournamentRevision are all null when only an OPEN or
        CLOSED recruitment was cancelled; otherwise all three identify the cancelled linked
        tournament. reversedGameCount is zero for a recruitment-only cancellation.
      properties:
        recruitmentId:
          type: string
          format: uuid
        recruitmentStatus:
          type: string
          const: CANCELLED
        recruitmentRevision:
          type: integer
          format: int64
          minimum: 0
        tournamentId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        tournamentStatus:
          oneOf:
            - type: string
              const: CANCELLED
            - type: 'null'
        tournamentRevision:
          oneOf:
            - type: integer
              format: int64
              minimum: 0
            - type: 'null'
        reversedGameCount:
          type: integer
          format: int64
          minimum: 0
    AuctionRecruitmentForceCancelResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AuctionRecruitmentForceCancelResult'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    WebAddAuctionRecruitmentMemberRequest:
      type: object
      additionalProperties: false
      required: [memberId, declaredLane]
      description: >-
        The authenticated session supplies the actor. A current active operator selects an
        existing ACTIVE guild member and explicitly chooses that member's declared lane.
      properties:
        memberId:
          $ref: '#/components/schemas/UserIdentifier'
        declaredLane:
          $ref: '#/components/schemas/Lane'
    WebRemoveAuctionRecruitmentMemberRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: >-
        Empty browser request body. The authenticated session supplies the actor and only a
        current active operator can remove the path participant.
    ActorRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
    BindRecruitmentMessageRequest:
      type: object
      additionalProperties: false
      required: [actor, channelId, messageId]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        channelId:
          $ref: '#/components/schemas/DiscordSnowflake'
        messageId:
          $ref: '#/components/schemas/DiscordSnowflake'
    JoinRecruitmentRequest:
      type: object
      additionalProperties: false
      required: [actor, member]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        member:
          $ref: '#/components/schemas/DiscordActor'
    WebAddRecruitmentMemberRequest:
      type: object
      additionalProperties: false
      required: [memberId]
      properties:
        memberId:
          $ref: '#/components/schemas/UserIdentifier'
    WebRemoveRecruitmentMemberRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: >-
        Empty browser request body. The authenticated session supplies the actor and only a
        current active operator can remove the path participant.
    WebCloseRecruitmentRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: >-
        Empty browser request body. The authenticated session supplies the actor and only a
        current active operator can start entry editing for a full recruitment.
    SetPreferredLanesRequest:
      type: object
      additionalProperties: false
      required: [actor, preferredLanes]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        preferredLanes:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Lane'
    RecruitmentParticipant:
      type: object
      additionalProperties: false
      required: [id, displayName, preferredLanes]
      properties:
        id:
          $ref: '#/components/schemas/UserIdentifier'
        displayName:
          type: string
          minLength: 1
        preferredLanes:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Lane'
    RecruitmentMutationItem:
      type: object
      additionalProperties: false
      required:
        - id
        - displayNumber
        - title
        - status
        - targetCount
        - revision
        - createdById
        - channelId
        - messageId
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        displayNumber:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
        status:
          type: string
          enum: [OPEN, CLOSED, CANCELLED]
        targetCount:
          type: integer
          const: 10
        revision:
          type: integer
          format: int64
          minimum: 0
        createdById:
          $ref: '#/components/schemas/UserIdentifier'
        channelId:
          oneOf:
            - $ref: '#/components/schemas/DiscordSnowflake'
            - type: 'null'
        messageId:
          oneOf:
            - $ref: '#/components/schemas/DiscordSnowflake'
            - type: 'null'
        updatedAt:
          type: string
          format: date-time
    RecruitmentLinks:
      type: object
      additionalProperties: false
      required: [entry]
      properties:
        entry:
          type: string
          format: uri-reference
          pattern: '^/g/'
    RecruitmentSnapshot:
      type: object
      additionalProperties: false
      required: [recruitment, participants, links]
      properties:
        recruitment:
          $ref: '#/components/schemas/RecruitmentMutationItem'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RecruitmentParticipant'
        links:
          $ref: '#/components/schemas/RecruitmentLinks'
    RecruitmentSnapshotResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/RecruitmentSnapshot'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EntryDraftSlot:
      type: string
      enum:
        - TEAM_1_TOP
        - TEAM_1_JUNGLE
        - TEAM_1_MID
        - TEAM_1_BOTTOM
        - TEAM_1_SUPPORT
        - TEAM_2_TOP
        - TEAM_2_JUNGLE
        - TEAM_2_MID
        - TEAM_2_BOTTOM
        - TEAM_2_SUPPORT
    EntryDraftRecruitment:
      type: object
      additionalProperties: false
      description: >-
        Recruitment lifecycle projection within the composite entry snapshot. Its revision belongs
        to the recruitment aggregate and its realtime topic, not to the entry-draft aggregate.
      required: [id, displayNumber, title, status, targetCount, revision, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        displayNumber:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum: [OPEN, CLOSED]
        targetCount:
          type: integer
          const: 10
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Recruitment aggregate concurrency revision. Reopen uses this value as expectedRevision;
            recruitment-topic invalidates use this value as their revision.
        updatedAt:
          type: string
          format: date-time
    EntryDraftEditor:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          $ref: '#/components/schemas/UserIdentifier'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    EntryDraftParticipant:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - preferredLanes
        - mainLane
        - mmr
        - games
        - wins
        - riotTier
        - profileIconId
        - championIds
      properties:
        id:
          $ref: '#/components/schemas/UserIdentifier'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        preferredLanes:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Lane'
        mainLane:
          oneOf:
            - $ref: '#/components/schemas/Lane'
            - type: 'null'
        mmr:
          type: number
          format: double
        games:
          type: integer
          format: int32
          minimum: 0
        wins:
          type: integer
          format: int32
          minimum: 0
        riotTier:
          description: >-
            Compact current solo-queue tier from the participant's cached primary Riot account,
            for example P3 or E2. Null when no canonical cached solo rank is available.
          oneOf:
            - type: string
              pattern: '^(?:I|B|S|G|P|E|D|M|GM|C)[1-4]?$'
            - type: 'null'
        profileIconId:
          oneOf:
            - type: integer
              format: int32
              minimum: 0
            - type: 'null'
        championIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
    EntryDraftAssignment:
      type: object
      additionalProperties: false
      required: [participantId, team, lane]
      properties:
        participantId:
          $ref: '#/components/schemas/UserIdentifier'
        team:
          type: string
          enum: [TEAM_1, TEAM_2]
        lane:
          $ref: '#/components/schemas/Lane'
    EntryDraftState:
      type: object
      additionalProperties: false
      description: >-
        Entry-composition aggregate within the composite snapshot. Its revision is independent from
        recruitment.revision and owns entry-draft mutation concurrency.
      required: [revision, updatedAt, updatedBy, participants, assignments]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Entry-draft aggregate concurrency revision. PATCH and reset use this as expectedRevision;
            recruitment-entry-draft-topic invalidates use this value as their revision.
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/EntryDraftEditor'
            - type: 'null'
        participants:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/EntryDraftParticipant'
        assignments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/EntryDraftAssignment'
    EntryDraftCapabilities:
      type: object
      additionalProperties: false
      required:
        [canEdit, canReset, canCreateSeries, canCreateAuctionRecruitment, canReopen, canCancel]
      properties:
        canEdit:
          type: boolean
        canReset:
          type: boolean
        canCreateSeries:
          type: boolean
          description: >-
            True only when the viewer is a current active operator, the recruitment is CLOSED, and
            all ten JOINED participants occupy one distinct TEAM_1/TEAM_2 lane slot. The create
            command still revalidates this state transactionally.
        canCreateAuctionRecruitment:
          type: boolean
          description: >-
            True only when the viewer is a current active operator, the recruitment is CLOSED, it
            has exactly ten JOINED participants, it has not already been converted, and no active
            series exists for the source recruitment. Lane assignments are not required. The
            conversion command still revalidates this state transactionally.
        canReopen:
          type: boolean
        canCancel:
          type: boolean
          description: >-
            True only when the viewer is the recruitment creator or a current active operator and
            the recruitment is OPEN or CLOSED. DELETE then transitions it to CANCELLED.
    EntryDraftSnapshot:
      type: object
      additionalProperties: false
      required: [recruitment, draft, capabilities]
      properties:
        recruitment:
          $ref: '#/components/schemas/EntryDraftRecruitment'
        draft:
          $ref: '#/components/schemas/EntryDraftState'
        capabilities:
          $ref: '#/components/schemas/EntryDraftCapabilities'
    EntryDraftSnapshotResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/EntryDraftSnapshot'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EntryDraftMoveParticipantOperation:
      type: object
      additionalProperties: false
      required: [type, participantId, slot]
      properties:
        type:
          type: string
          const: MOVE_PARTICIPANT
        participantId:
          $ref: '#/components/schemas/UserIdentifier'
        slot:
          oneOf:
            - $ref: '#/components/schemas/EntryDraftSlot'
            - type: 'null'
    EntryDraftMutationRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, operation]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        operation:
          $ref: '#/components/schemas/EntryDraftMoveParticipantOperation'
    EntryDraftRevisionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    RecruitmentLifecycleRevisionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      description: >-
        Optimistic lifecycle guard used by cancellation, restoration, and recruitment-stage
        rollback commands. The client must send the latest visible recruitment revision.
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    EntryDraftAuctionConversionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, expectedStartAt]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: Current source recruitment revision, not the entry-draft revision.
        expectedStartAt:
          type: string
          format: date-time
