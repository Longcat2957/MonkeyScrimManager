  /api/dev/dummy-users/{userId}/archive:
    post:
      operationId: archiveDummyUser
      summary: Archive a dummy user
      description: >-
        Archive is a profile lifecycle state, not account deletion, so users.deleted_at remains
        null and historical projections remain readable. The command is rejected while the user
        is JOINED to any OPEN or CLOSED general or auction recruitment. On success, every ACTIVE
        guild membership is changed to INACTIVE and each affected guild's MEMBERS revision and
        MEMBER_STATUS_CHANGED audit entry are committed in the same transaction. The admin
        members resource has no WebSocket topic, so this command does not create an invalidate
        outbox event.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/DummyUserId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpectedRevisionRequest'
      responses:
        '200':
          description: Authoritative archived dummy user.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DummyUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Revision or idempotency conflict, or an active recruitment still contains the dummy
            user as a JOINED participant.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                activeRecruitmentParticipation:
                  summary: General and auction participation must be withdrawn first
                  value:
                    error:
                      code: dummy_user_archive_blocked_by_recruitment
                      message: 진행 중인 일반 또는 경매 모집에 참가 중이라 보관할 수 없습니다. 먼저 참가를 취소해 주세요.
                      requestId: 01900000-0000-7000-8000-000000000001
                      details:
                        joinedRecruitments: 1
                        joinedAuctionRecruitments: 1
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
