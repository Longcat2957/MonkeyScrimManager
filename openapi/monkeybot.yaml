      description: >-
        Browser-only recovery command for the creator or a current active operator. The recruitment
        must be CANCELLED and expectedRevision must be current. The server restores CLOSED when the
        recruitment had reached captain selection before cancellation, otherwise OPEN. The roster
        and captain setup are preserved, cancellation/conversion markers are cleared, and a
        replacement Discord recruitment message is queued without resurrecting cancelled
        tournaments, games, or MMR results.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
