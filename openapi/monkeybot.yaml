        RED:
          type: array
          minItems: 5
          maxItems: 5
          items:
            oneOf:
              - $ref: '#/components/schemas/SeriesPickBanChampionId'
              - type: 'null'
    SeriesPickBanCurrentGame:
      type: object
      additionalProperties: false
