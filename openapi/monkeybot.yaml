    post:
      operationId: joinGuildAuctionRecruitment
      summary: Join a member to an open auction recruitment
      description: >-
        Bot requests sync the Discord actor identity and self-join when member is omitted. An
        optional member Discord snapshot selects a target instead; a distinct target requires the
        actor to hold the configured operator role. Browser requests are limited to a current
        active operator and select an existing ACTIVE guild member by memberId. The browser target
        is an opaque stored user identifier and can be a Discord or development-dummy user;
        browser callers must explicitly choose declaredLane. The backend captures the
        current-season target lane MMR and serializes capacity, duplicate, and lifecycle checks
        against the canonical roster. A changed bound Discord message queues
        AUCTION_RECRUITMENT_MESSAGE_UPDATE in the same transaction.
      security:
        - BotBearer: []
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/AuctionRecruitmentId'
        - $ref: '#/components/parameters/RecruitmentMemberIdempotencyKey'
