        series:
          $ref: '#/components/schemas/SeriesPickBanSeries'
        teams:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/SeriesPickBanTeam'
        currentGame:
          $ref: '#/components/schemas/SeriesPickBanCurrentGame'
        games:
          type: array
          maxItems: 0
          description: Always empty until persisted game-history delivery is added in a later vertical slice.
          items: {}
        capabilities:
          $ref: '#/components/schemas/SeriesPickBanCapabilities'
