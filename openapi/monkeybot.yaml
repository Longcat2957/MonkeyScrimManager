          type: string
          format: uri-reference
          pattern: '^/g/'
          description: Canonical workspace URL after the lifecycle command commits.
    SeriesLifecycleResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SeriesLifecycleData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    BotInstanceId:
      type: string
      minLength: 1
      maxLength: 128
      pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]*$'
      description: Stable process instance identity used to own a notification lease.
    BotNotificationType:
      type: string
      minLength: 1
      maxLength: 100
      description: >-
        Notification type interpreted by the Bot worker. Recruitment CREATE sends a new message,
        AUCTION_RECRUITMENT_MESSAGE_CREATE sends a new auction recruitment message; the matching
        UPDATE and DELETE values edit or remove its bound message. General recruitment UPDATE and
        DELETE operate on their own aggregate; ENTRY_CONFIRMATION_CREATE sends the immutable roster
        card, and SERIES_RESULT_CREATE sends an immutable result card.
      enum:
        - RECRUITMENT_MESSAGE_CREATE
        - RECRUITMENT_MESSAGE_UPDATE
        - RECRUITMENT_MESSAGE_DELETE
        - AUCTION_RECRUITMENT_MESSAGE_CREATE
        - AUCTION_RECRUITMENT_MESSAGE_UPDATE
        - AUCTION_RECRUITMENT_MESSAGE_DELETE
        - ENTRY_CONFIRMATION_CREATE
        - SERIES_RESULT_CREATE
    RecruitmentMessageNotificationPayload:
      type: object
      additionalProperties: false
      required: [schemaVersion, recruitmentId, snapshot]
      properties:
        schemaVersion:
          type: integer
          const: 1
        recruitmentId:
          type: string
          format: uuid
        snapshot:
          $ref: '#/components/schemas/RecruitmentSnapshot'
    AuctionRecruitmentMessageNotificationPayload:
      type: object
      additionalProperties: false
      required: [schemaVersion, auctionRecruitmentId, snapshot]
      properties:
        schemaVersion:
          type: integer
          const: 2
          description: New rows use v2. Bot relay also normalizes unclaimed historical v1 rows without rules to BO3 and hardFearless=false.
        auctionRecruitmentId:
          type: string
          format: uuid
        snapshot:
          $ref: '#/components/schemas/AuctionRecruitmentSnapshot'
    EntryConfirmationNotificationPlayer:
