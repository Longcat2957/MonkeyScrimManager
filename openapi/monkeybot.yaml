        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesLifecycleRequest'
      responses:
        '200':
          description: Series and its source recruitment were cancelled, or an identical command was replayed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesLifecycleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
