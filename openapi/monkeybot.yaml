components:
  securitySchemes:
    BotBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
      description: >-
        Bot service-principal credential. It is independent from Discord bot tokens and browser
        session cookies and is compared against the configured backend secret.
    SessionCookie:
      type: apiKey
      in: cookie
      name: monkeybot_session
      description: Opaque host-only session token. The database stores only its SHA-256 hash.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Required for unsafe browser methods and must exactly match the readable monkeybot_csrf
        cookie. Origin validation is applied independently.
  parameters:
    GuildId:
      name: guildId
      in: path
      required: true
      description: Discord guild snowflake encoded as a JSON/URL string.
      schema:
        $ref: '#/components/schemas/DiscordSnowflake'
    RecruitmentId:
      name: recruitmentId
      in: path
      required: true
      description: Recruitment root UUID. It is not the guild-local display number.
      schema:
        type: string
        format: uuid
    SeriesId:
      name: seriesId
      in: path
      required: true
      description: General-series root UUID. It is not the guild-local display number.
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: Opaque stored user identifier. It can identify a Discord or development dummy user.
      schema:
        $ref: '#/components/schemas/UserIdentifier'
    MemberId:
      name: memberId
      in: path
      required: true
      description: Opaque stored user identifier for the guild member being administered.
      schema:
        $ref: '#/components/schemas/UserIdentifier'
    DummyUserId:
      name: userId
      in: path
      required: true
      description: Development dummy user identifier generated by the backend.
      schema:
        $ref: '#/components/schemas/DummyUserIdentifier'
    DummyGroupId:
      name: groupId
      in: path
      required: true
      description: Persistent dummy-user group UUID.
      schema:
        type: string
        format: uuid
    ChampionPreferenceLane:
      name: lane
      in: path
      required: true
      description: Canonical lane whose ordered champion preferences are replaced.
      schema:
        $ref: '#/components/schemas/Lane'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Discord interaction ID. Reuse with an identical route and request replays the stored
        response; reuse with a different request returns idempotency_conflict.
      schema:
        $ref: '#/components/schemas/DiscordSnowflake'
    BrowserIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Browser-generated key for a user-initiated unsafe command; UUIDv4 is recommended and used
        by the web client. Reuse with an identical route and request replays the stored response;
        reuse with a different request returns idempotency_conflict. This is distinct from a Bot
        command's Discord interaction ID.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
      example: 2c26bd12-cfdd-4d13-b5b2-17c6db65c7f1
    RecruitmentCreateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Bot requests use the Discord interaction ID. Browser requests use a visible ASCII key up
        to 128 bytes. Reuse with the identical authenticated principal and request replays the
        stored response; a changed request returns idempotency_conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
    RecruitmentMemberIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Bot requests use the Discord interaction ID. Browser operator requests use a visible
        ASCII key up to 128 bytes. Reuse with the identical authenticated principal and request
        replays the stored response; a changed request returns idempotency_conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
    ActionableState:
      name: state
      in: query
      required: true
      description: Select the actionable projection.
      schema:
        type: string
        const: actionable
    ActiveCompletedState:
      name: state
      in: query
      required: true
      description: Select active work or completed results.
      schema:
        type: string
        enum: [active, completed]
    PageCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque URL-safe cursor returned as nextCursor by the same endpoint and state query. Clients
        must not inspect or construct its contents.
      schema:
        type: string
        minLength: 1
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of rows to return. Defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    SearchSuggestionQuery:
      name: q
      in: query
      required: true
      description: Prefix used by navbar autocomplete after endpoint-specific normalization.
      schema:
        type: string
        minLength: 2
    SearchSuggestionLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of suggestions to return.
      schema:
        type: integer
        minimum: 1
        maximum: 8
        default: 8
    GuildRecordsProfileQuery:
      name: q
      in: query
      required: true
      description: >-
        Exact stored UserIdentifier, guild display name, or full GameName#TagLine. Leading and
        trailing whitespace is removed. Display names are matched case-insensitively; Riot IDs use
        the canonical NFKC, trim, and Unicode case-fold normalization.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      examples:
        displayName:
          value: Longcat
        riotId:
          value: Longcat#KR1
        discordId:
          value: '1525847677542207548'
        dummyUserId:
          value: dmy_01900000-0000-7000-8000-000000000001
    GuildRecordsSeasonId:
      name: seasonId
      in: query
      required: false
      description: >-
        Guild-owned season UUID to select. When omitted, the active season is selected. If the
        guild has no active season, selectedSeasonId is null even when closed seasons exist. An
        unknown or foreign-guild UUID returns 404.
      schema:
        type: string
        format: uuid
    GuildRecordsPageCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque canonical URL-safe cursor returned by this endpoint. It represents the last
        (playedAt, id, kind) tuple and must be reused with the same q and seasonId selection.
      schema:
        $ref: '#/components/schemas/OpaquePageCursor'
    GuildRecordsPageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of SERIES or TOURNAMENT groups to return. Defaults to 20.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    RiotGameName:
      name: gameName
      in: query
      required: true
      description: Human-facing Riot game name without the `#` separator.
      schema:
        $ref: '#/components/schemas/RiotGameName'
      example: Longcat
    RiotTagLine:
      name: tagLine
      in: query
      required: true
      description: Human-facing Riot tag line without the `#` separator.
      schema:
        $ref: '#/components/schemas/RiotTagLine'
      example: KR1
    RiotPlatformQuery:
      name: platform
      in: query
      required: true
      description: Riot platform routing code. The MVP allowlist contains KR only.
      schema:
        $ref: '#/components/schemas/RiotPlatform'
    RiotPuuid:
      name: puuid
      in: path
      required: true
      description: Opaque PUUID previously resolved and stored by the backend.
      schema:
        $ref: '#/components/schemas/RiotPuuidValue'
  headers:
    RequestId:
      description: Backend-generated UUIDv7 request identifier.
      schema:
        type: string
        format: uuid
    RedirectLocation:
      description: Absolute external authorization URL or allowlisted same-origin application URL.
      schema:
        type: string
        format: uri-reference
    OAuthStateCookie:
      description: >-
        `monkeybot_oauth_state`; host-only, HttpOnly, Secure, SameSite=Lax,
        Path=/oauth/callback, Max-Age=300.
      schema:
        type: string
        example: monkeybot_oauth_state=opaque; Path=/oauth/callback; Max-Age=300; Secure; HttpOnly; SameSite=Lax
    AuthenticatedSessionCookies:
      description: >-
        Three separate Set-Cookie fields: `monkeybot_session` (host-only, HttpOnly, Secure,
        SameSite=Lax, Path=/), `monkeybot_csrf` (host-only, Secure, SameSite=Lax, Path=/; readable
        by the browser client), and `monkeybot_oauth_state` expired with Path=/oauth/callback.
        They must not be folded into one comma-separated field.
      schema:
        type: array
        items:
          type: string
    ClearedSessionCookies:
      description: >-
        Two separate Set-Cookie fields that expire `monkeybot_session` and `monkeybot_csrf` with
        Path=/ and Max-Age=0. They must not be folded into one comma-separated field.
      schema:
        type: array
        items:
          type: string
  responses:
    BadRequest:
      description: Invalid query, path, body, OAuth state, or OAuth callback shape.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: >-
        Browser session or Bot bearer authentication is absent, invalid, expired, or revoked for
        the requested principal type.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF or Origin validation failed, or the principal lacks the required role.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found, including a resource hidden by tenant isolation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Revision, state, idempotency, or ambiguous exact-identity lookup conflict.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Domain invariant violation such as capacity, membership, or required lanes.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required dependency is temporarily unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: An authenticated upstream provider timed out, rejected the request, or returned invalid data.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: >-
        A local route limit or upstream provider limit was exceeded. When supplied by the provider,
        error.details.retryAfterSeconds contains the non-negative retry delay.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: An internal invariant, stored-data, or programming error occurred.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    DiscordSnowflake:
      type: string
      pattern: '^[1-9][0-9]{0,19}$'
      maxLength: 20
      description: Canonical unsigned decimal value not greater than 18446744073709551615.
      example: '123456789012345678'
    DummyUserIdentifier:
      type: string
      pattern: '^dmy_[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: Backend-generated development dummy identity using a lowercase RFC 4122 UUIDv7.
      example: dmy_01900000-0000-7000-8000-000000000001
    UserIdentifier:
      description: Opaque stored user ID. Clients must not infer permissions or provider behavior from it.
      oneOf:
        - $ref: '#/components/schemas/DiscordSnowflake'
        - $ref: '#/components/schemas/DummyUserIdentifier'
    UserIdentityKind:
      type: string
      enum: [DISCORD, DUMMY]
    Lane:
      type: string
      enum: [TOP, JUNGLE, MID, BOTTOM, SUPPORT]
    DiscordActor:
      type: object
      additionalProperties: false
      required: [id, globalDisplayName, displayName, avatarHash, roleIds]
      properties:
        id:
          $ref: '#/components/schemas/DiscordSnowflake'
        globalDisplayName:
          type: string
          minLength: 1
          maxLength: 100
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        avatarHash:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        roleIds:
          type: array
          items:
            $ref: '#/components/schemas/DiscordSnowflake'
    SetupGuildRequest:
      type: object
      additionalProperties: false
      required:
        - actor
        - guildName
        - guildIconHash
        - operatorRoleId
        - recruitmentChannelId
        - entryChannelId
        - resultChannelId
        - logChannelId
        - seasonName
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        guildName:
          type: string
          minLength: 1
          maxLength: 100
        guildIconHash:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        operatorRoleId:
          $ref: '#/components/schemas/DiscordSnowflake'
        recruitmentChannelId:
          $ref: '#/components/schemas/DiscordSnowflake'
        entryChannelId:
          oneOf:
            - $ref: '#/components/schemas/DiscordSnowflake'
            - type: 'null'
        resultChannelId:
          oneOf:
            - $ref: '#/components/schemas/DiscordSnowflake'
            - type: 'null'
        logChannelId:
          oneOf:
            - $ref: '#/components/schemas/DiscordSnowflake'
            - type: 'null'
        seasonName:
          type: string
          minLength: 1
          maxLength: 100
    SetupGuildCurrentSeason:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
    SetupGuild:
      type: object
      additionalProperties: false
      required: [id, displayName, operatorRoleId, currentSeason, dashboardHref]
      properties:
        id:
          $ref: '#/components/schemas/DiscordSnowflake'
        displayName:
          type: string
          minLength: 1
        operatorRoleId:
          $ref: '#/components/schemas/DiscordSnowflake'
        currentSeason:
          $ref: '#/components/schemas/SetupGuildCurrentSeason'
        dashboardHref:
          type: string
          format: uri-reference
          pattern: '^/g/'
    SetupGuildData:
      type: object
      additionalProperties: false
      required: [guild]
      properties:
        guild:
          $ref: '#/components/schemas/SetupGuild'
    SetupGuildResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SetupGuildData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RegisterGuildMemberRequest:
      type: object
      additionalProperties: false
      required: [actor, gameName, tagLine, platform]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        gameName:
          $ref: '#/components/schemas/RiotGameName'
        tagLine:
          $ref: '#/components/schemas/RiotTagLine'
        platform:
          $ref: '#/components/schemas/RiotPlatform'
    RegistrationState:
      type: string
      enum: [CREATED, EXISTING]
    RegisteredGuildMember:
      type: object
      additionalProperties: false
      required: [id, displayName, status]
      properties:
        id:
          $ref: '#/components/schemas/DiscordSnowflake'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          const: ACTIVE
    RegisteredRiotAccount:
      type: object
      additionalProperties: false
      required: [puuid, gameName, tagLine, platform, isMain]
      properties:
        puuid:
          $ref: '#/components/schemas/RiotPuuidValue'
        gameName:
          $ref: '#/components/schemas/RiotGameName'
        tagLine:
          $ref: '#/components/schemas/RiotTagLine'
        platform:
          $ref: '#/components/schemas/RiotPlatform'
        isMain:
          type: boolean
    RegisterGuildMemberData:
      type: object
      additionalProperties: false
      required: [member, riotAccount, registration, accountLink]
      properties:
        member:
          $ref: '#/components/schemas/RegisteredGuildMember'
        riotAccount:
          $ref: '#/components/schemas/RegisteredRiotAccount'
        registration:
          $ref: '#/components/schemas/RegistrationState'
        accountLink:
          $ref: '#/components/schemas/RegistrationState'
    RegisterGuildMemberResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/RegisterGuildMemberData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DiscordCatalogRoleInput:
      type: object
      additionalProperties: false
      required: [id, name, position, managed]
      properties:
        id:
          $ref: '#/components/schemas/DiscordSnowflake'
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Leading and trailing whitespace is removed before storage.
        position:
          type: integer
          format: int32
          minimum: 0
        managed:
          type: boolean
    DiscordCatalogChannelKind:
      type: string
      enum: [TEXT, ANNOUNCEMENT]
    DiscordCatalogChannelInput:
      type: object
      additionalProperties: false
      required: [id, name, parentName, position, kind]
      properties:
        id:
          $ref: '#/components/schemas/DiscordSnowflake'
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Leading and trailing whitespace is removed before storage.
        parentName:
          oneOf:
            - type: string
              minLength: 1
              maxLength: 100
            - type: 'null'
        position:
          type: integer
          format: int32
          minimum: 0
        kind:
          $ref: '#/components/schemas/DiscordCatalogChannelKind'
    ReplaceGuildDiscordCatalogRequest:
      type: object
      additionalProperties: false
      required: [roles, channels]
      properties:
        roles:
          type: array
          maxItems: 250
          description: Role IDs must be unique and must not contain the guild's @everyone role.
          items:
            $ref: '#/components/schemas/DiscordCatalogRoleInput'
        channels:
          type: array
          maxItems: 500
          description: Channel IDs must be unique within the replacement snapshot.
          items:
            $ref: '#/components/schemas/DiscordCatalogChannelInput'
    DiscordCatalogSyncData:
      type: object
      additionalProperties: false
      required: [syncedAt]
      properties:
        syncedAt:
          type: string
          format: date-time
    DiscordCatalogSyncResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/DiscordCatalogSyncData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CreateRecruitmentRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
    WebCreateRecruitmentRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: >-
        Empty browser request body. The authenticated session supplies the actor; callers cannot
        choose another user.
    ActorRequest:
      type: object
      additionalProperties: false
      required: [actor]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
    BindRecruitmentMessageRequest:
      type: object
      additionalProperties: false
      required: [actor, channelId, messageId]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        channelId:
          $ref: '#/components/schemas/DiscordSnowflake'
        messageId:
          $ref: '#/components/schemas/DiscordSnowflake'
    JoinRecruitmentRequest:
      type: object
      additionalProperties: false
      required: [actor, member]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        member:
          $ref: '#/components/schemas/DiscordActor'
    WebAddRecruitmentMemberRequest:
      type: object
      additionalProperties: false
      required: [memberId]
      properties:
        memberId:
          $ref: '#/components/schemas/UserIdentifier'
    WebRemoveRecruitmentMemberRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: >-
        Empty browser request body. The authenticated session supplies the actor and only a
        current active operator can remove the path participant.
    WebCloseRecruitmentRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: >-
        Empty browser request body. The authenticated session supplies the actor and only a
        current active operator can start entry editing for a full recruitment.
    SetPreferredLanesRequest:
      type: object
      additionalProperties: false
      required: [actor, preferredLanes]
      properties:
        actor:
          $ref: '#/components/schemas/DiscordActor'
        preferredLanes:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Lane'
    RecruitmentParticipant:
      type: object
      additionalProperties: false
      required: [id, displayName, preferredLanes]
      properties:
        id:
          $ref: '#/components/schemas/UserIdentifier'
        displayName:
          type: string
          minLength: 1
        preferredLanes:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Lane'
    RecruitmentMutationItem:
      type: object
      additionalProperties: false
      required:
        - id
        - displayNumber
        - title
        - status
        - targetCount
        - revision
        - createdById
        - channelId
        - messageId
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        displayNumber:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
        status:
          type: string
          enum: [OPEN, CLOSED, CANCELLED]
        targetCount:
          type: integer
          const: 10
        revision:
          type: integer
          format: int64
          minimum: 0
        createdById:
          $ref: '#/components/schemas/UserIdentifier'
        channelId:
          oneOf:
            - $ref: '#/components/schemas/DiscordSnowflake'
            - type: 'null'
        messageId:
          oneOf:
            - $ref: '#/components/schemas/DiscordSnowflake'
            - type: 'null'
        updatedAt:
          type: string
          format: date-time
    RecruitmentLinks:
      type: object
      additionalProperties: false
      required: [entry]
      properties:
        entry:
          type: string
          format: uri-reference
          pattern: '^/g/'
    RecruitmentSnapshot:
      type: object
      additionalProperties: false
      required: [recruitment, participants, links]
      properties:
        recruitment:
          $ref: '#/components/schemas/RecruitmentMutationItem'
        participants:
          type: array
          items:
            $ref: '#/components/schemas/RecruitmentParticipant'
        links:
          $ref: '#/components/schemas/RecruitmentLinks'
    RecruitmentSnapshotResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/RecruitmentSnapshot'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EntryDraftSlot:
      type: string
      enum:
        - TEAM_1_TOP
        - TEAM_1_JUNGLE
        - TEAM_1_MID
        - TEAM_1_BOTTOM
        - TEAM_1_SUPPORT
        - TEAM_2_TOP
        - TEAM_2_JUNGLE
        - TEAM_2_MID
        - TEAM_2_BOTTOM
        - TEAM_2_SUPPORT
    EntryDraftRecruitment:
      type: object
      additionalProperties: false
      description: >-
        Recruitment lifecycle projection within the composite entry snapshot. Its revision belongs
        to the recruitment aggregate and its realtime topic, not to the entry-draft aggregate.
      required: [id, displayNumber, title, status, targetCount, revision, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        displayNumber:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 100
        status:
          type: string
          enum: [OPEN, CLOSED]
        targetCount:
          type: integer
          const: 10
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Recruitment aggregate concurrency revision. Reopen uses this value as expectedRevision;
            recruitment-topic invalidates use this value as their revision.
        updatedAt:
          type: string
          format: date-time
    EntryDraftEditor:
      type: object
      additionalProperties: false
      required: [id, displayName]
      properties:
        id:
          $ref: '#/components/schemas/UserIdentifier'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    EntryDraftParticipant:
      type: object
      additionalProperties: false
      required:
        - id
        - displayName
        - preferredLanes
        - mainLane
        - mmr
        - games
        - wins
        - riotTier
        - profileIconId
        - championIds
      properties:
        id:
          $ref: '#/components/schemas/UserIdentifier'
        displayName:
          type: string
          minLength: 1
          maxLength: 100
        preferredLanes:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Lane'
        mainLane:
          oneOf:
            - $ref: '#/components/schemas/Lane'
            - type: 'null'
        mmr:
          type: number
          format: double
        games:
          type: integer
          format: int32
          minimum: 0
        wins:
          type: integer
          format: int32
          minimum: 0
        riotTier:
          description: >-
            Compact current solo-queue tier from the participant's cached primary Riot account,
            for example P3 or E2. Null when no canonical cached solo rank is available.
          oneOf:
            - type: string
              pattern: '^(?:I|B|S|G|P|E|D|M|GM|C)[1-4]?$'
            - type: 'null'
        profileIconId:
          oneOf:
            - type: integer
              format: int32
              minimum: 0
            - type: 'null'
        championIds:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
    EntryDraftAssignment:
      type: object
      additionalProperties: false
      required: [participantId, team, lane]
      properties:
        participantId:
          $ref: '#/components/schemas/UserIdentifier'
        team:
          type: string
          enum: [TEAM_1, TEAM_2]
        lane:
          $ref: '#/components/schemas/Lane'
    EntryDraftState:
      type: object
      additionalProperties: false
      description: >-
        Entry-composition aggregate within the composite snapshot. Its revision is independent from
        recruitment.revision and owns entry-draft mutation concurrency.
      required: [revision, updatedAt, updatedBy, participants, assignments]
      properties:
        revision:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Entry-draft aggregate concurrency revision. PATCH and reset use this as expectedRevision;
            recruitment-entry-draft-topic invalidates use this value as their revision.
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          oneOf:
            - $ref: '#/components/schemas/EntryDraftEditor'
            - type: 'null'
        participants:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/EntryDraftParticipant'
        assignments:
          type: array
          maxItems: 10
          items:
            $ref: '#/components/schemas/EntryDraftAssignment'
    EntryDraftCapabilities:
      type: object
      additionalProperties: false
      required: [canEdit, canReset, canCreateSeries, canReopen, canCancel]
      properties:
        canEdit:
          type: boolean
        canReset:
          type: boolean
        canCreateSeries:
          type: boolean
          description: >-
            True only when the viewer is a current active operator, the recruitment is CLOSED, and
            all ten JOINED participants occupy one distinct TEAM_1/TEAM_2 lane slot. The create
            command still revalidates this state transactionally.
        canReopen:
          type: boolean
        canCancel:
          type: boolean
          description: >-
            True only when the viewer is the recruitment creator or a current active operator and
            the recruitment is OPEN or CLOSED. DELETE then transitions it to CANCELLED.
    EntryDraftSnapshot:
      type: object
      additionalProperties: false
      required: [recruitment, draft, capabilities]
      properties:
        recruitment:
          $ref: '#/components/schemas/EntryDraftRecruitment'
        draft:
          $ref: '#/components/schemas/EntryDraftState'
        capabilities:
          $ref: '#/components/schemas/EntryDraftCapabilities'
    EntryDraftSnapshotResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/EntryDraftSnapshot'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    EntryDraftMoveParticipantOperation:
      type: object
      additionalProperties: false
      required: [type, participantId, slot]
      properties:
        type:
          type: string
          const: MOVE_PARTICIPANT
        participantId:
          $ref: '#/components/schemas/UserIdentifier'
        slot:
          oneOf:
            - $ref: '#/components/schemas/EntryDraftSlot'
            - type: 'null'
    EntryDraftMutationRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision, operation]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
        operation:
          $ref: '#/components/schemas/EntryDraftMoveParticipantOperation'
    EntryDraftRevisionRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
    CreateSeriesFromEntryDraftRequest:
      type: object
      additionalProperties: false
      required: [sourceRecruitmentId, expectedRevision]
      properties:
        sourceRecruitmentId:
          type: string
          format: uuid
          description: CLOSED general recruitment to convert. This is not a display number.
        expectedRevision:
          type: integer
          format: int64
          minimum: 0
          description: Current source recruitment revision, not the entry-draft revision.
    SeriesLifecycleRequest:
      type: object
      additionalProperties: false
      required: [expectedRevision]
      properties:
        expectedRevision:
          type: integer
