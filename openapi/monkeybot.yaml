    post:
      operationId: resetGuildRecruitmentEntryDraft
      summary: Clear assignments in a closed general-recruitment entry draft
      description: >-
        Browser-session command for a current active operator only. The recruitment must be CLOSED
        and expectedRevision must equal the current draft revision. It removes every assignment,
        retains the joined recruitment participants, and returns the authoritative snapshot. Its
        realtime invalidate uses the recruitment-entry-draft topic and the draft revision.
