            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            Includes invalid_series_create_request for an invalid body and entry_draft_incomplete
            when the full ten-person team-and-lane assignment is not present.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/guilds/{guildId}/series/{seriesId}:
    get:
      operationId: getGuildSeriesPickBan
      summary: Get the authoritative general-series pick-ban snapshot
      description: >-
        Returns the IN_PROGRESS general-series roster frozen from its entry draft, the current
        pick-ban set, and viewer-specific lifecycle capabilities for an active guild member. This
        first vertical slice returns games as an empty array and exposes a synthetic DEFAULT
        current game when no persisted draft exists; pick/ban and game-result mutations are not
        part of this endpoint.
      security:
        - SessionCookie: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/SeriesId'
      responses:
        '200':
          description: Authoritative IN_PROGRESS pick-ban series snapshot.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesPickBanSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: The series is missing, not accessible to the active member, or is no longer IN_PROGRESS.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: deleteGuildSeries
      summary: Cancel an unplayed general series and cancel its source recruitment
      description: >-
        Browser-session command for a current active operator only. The expectedRevision is the
        series revision. It is accepted only while the series is IN_PROGRESS and has no confirmed
        games. The series is retained as CANCELLED for history while its source recruitment is
        transitioned to CANCELLED rather than reopened. The transaction writes audit and realtime
        outbox records atomically; an identical browser idempotency key replays the result.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/SeriesId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeriesLifecycleRequest'
      responses:
        '200':
          description: Series and its source recruitment were cancelled, or an identical command was replayed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeriesLifecycleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Includes series_revision_conflict for a stale expectedRevision,
            series_not_in_progress when the series has already transitioned,
            series_source_not_converted when its source is no longer CONVERTED,
            series_has_confirmed_games when history must be rolled back first, or an
            idempotency_conflict.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Includes invalid_series_lifecycle_request for an invalid body.
          headers:
