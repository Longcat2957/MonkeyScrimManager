        - $ref: '#/components/schemas/SeriesResultNotificationPayloadV2'
      description: >-
        Versioned immutable payload. SERIES_RESULT_CREATE emits only schemaVersion 2; schemaVersion
        1 remains valid solely so the Bot can deliver pending compact rows without rewriting or
        replaying them.
