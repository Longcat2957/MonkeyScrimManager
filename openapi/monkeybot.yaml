          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createGuildRecruitment
      summary: Create a 10-person general recruitment
      description: >-
        Creates an OPEN recruitment and its empty entry draft. Either a Bot interaction or an
        authenticated active guild member can create one. Bot requests include the Discord actor
        snapshot; browser requests use an empty object and derive the actor from the session. The
        active guild season and title/display counter are selected by the backend; targetCount is
        always 10. Browser creation additionally requires the guild recruitment channel to be
        configured. Its transaction enqueues a RECRUITMENT_MESSAGE_CREATE delivery for that
        channel; 201 means the database state and delivery work were accepted, not that Discord
        has already posted the message.
      security:
        - BotBearer: []
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/RecruitmentCreateIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CreateRecruitmentRequest'
                - $ref: '#/components/schemas/WebCreateRecruitmentRequest'
      responses:
        '201':
          description: Recruitment created or an identical interaction replayed.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecruitmentSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Idempotency or domain conflict. recruitment_channel_not_configured means a browser
            recruitment cannot be created until the guild recruitment channel is configured.
