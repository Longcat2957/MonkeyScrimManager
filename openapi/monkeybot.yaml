                      message: 진행 중인 일반 또는 경매 모집에 참가 중이라 보관할 수 없습니다. 먼저 참가를 취소해 주세요.
                      requestId: 01900000-0000-7000-8000-000000000001
                      details:
                        joinedRecruitments: 1
                        joinedAuctionRecruitments: 1
