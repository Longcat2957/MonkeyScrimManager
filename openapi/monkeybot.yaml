          application/json:
            schema:
              $ref: '#/components/schemas/RecruitmentLifecycleRevisionRequest'
      responses:
        '200':
          description: Auction recruitment restored to its safe prior stage or replayed idempotently.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuctionRecruitmentSnapshotResponse'
