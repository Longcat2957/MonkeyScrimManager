          $ref: '#/components/schemas/ResponseMeta'
    GuildRecordsProfileMember:
      type: object
      additionalProperties: false
      required: [displayName, avatarUrl, mainLane, profileHref]
      properties:
        displayName:
          type: string
          minLength: 1
        avatarUrl:
          oneOf:
            - type: string
              format: uri
            - type: 'null'
        mainLane:
          oneOf:
            - $ref: '#/components/schemas/Lane'
            - type: 'null'
        profileHref:
          description: >-
            Canonical public-profile route for a Discord identity with publicProfile enabled;
            null for private or DUMMY identities. Clients must use this value as-is.
          oneOf:
            - type: string
              pattern: '^/users/[1-9][0-9]{0,19}$'
            - type: 'null'
    GuildRecordsVisibleRiotAccount:
      type: object
      additionalProperties: false
      description: >-
        Privacy-filtered Riot identity linked to the resolved Discord user. This projection
        intentionally excludes PUUID, routing region, timestamps, and owner identifiers.
      required: [platform, gameName, tagLine, profileIconId, isMain]
      properties:
        platform:
          $ref: '#/components/schemas/RiotPlatform'
        gameName:
          $ref: '#/components/schemas/RiotGameName'
        tagLine:
          $ref: '#/components/schemas/RiotTagLine'
        profileIconId:
          oneOf:
            - type: integer
              format: int32
              minimum: 0
            - type: 'null'
        isMain:
          type: boolean
    GuildRecordsProfileData:
      type: object
      additionalProperties: false
      required: [member, championPreferences, riotAccounts]
      properties:
        member:
          $ref: '#/components/schemas/GuildRecordsProfileMember'
        championPreferences:
          $ref: '#/components/schemas/ChampionPreferences'
        riotAccounts:
          type: array
          description: >-
            Every linked Riot identity when show_riot_ids is true, ordered with the main account
            first. Empty when linkage disclosure is disabled, the setting row is absent, or the
            user has no linked account.
          items:
            $ref: '#/components/schemas/GuildRecordsVisibleRiotAccount'
    GuildRecordsProfileResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/GuildRecordsProfileData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    GuildRecordsSeason:
      type: object
      additionalProperties: false
      required: [id, name, status, startedAt, endedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        status:
          $ref: '#/components/schemas/GuildSeasonStatus'
        startedAt:
          type: string
          format: date-time
        endedAt:
          oneOf:
            - type: string
              format: date-time
            - type: 'null'
    GuildRecordsSummary:
      type: object
      additionalProperties: false
      required: [games, wins, losses]
      properties:
        games:
          type: integer
          format: int64
          minimum: 0
        wins:
          type: integer
          format: int64
          minimum: 0
        losses:
          type: integer
          format: int64
          minimum: 0
      description: >-
        Target-perspective aggregate over every confirmed game in the selected season. Every game
        has one winning side, so games equals wins plus losses. DRAW is only a completed series
        outcome.
    GuildRecordsLaneMmr:
      type: object
      additionalProperties: false
      required: [lane, mmr, games, wins]
      properties:
        lane:
          $ref: '#/components/schemas/Lane'
        mmr:
          type: number
          format: double
        games:
          type: integer
          format: int64
          minimum: 0
        wins:
          type: integer
          format: int64
          minimum: 0
      description: >-
        Current selected-season lane summary. A missing user_lane_mmr row is projected as MMR 1500,
        zero games, and zero wins without creating a database row. Wins never exceeds games.
    GuildRecordsChampionRecord:
      type: object
      additionalProperties: false
      required: [championId, lane, games, wins, losses]
      properties:
        championId:
          $ref: '#/components/schemas/ChampionId'
        lane:
          $ref: '#/components/schemas/Lane'
        games:
          type: integer
          format: int64
          minimum: 1
        wins:
          type: integer
          format: int64
          minimum: 0
        losses:
          type: integer
          format: int64
          minimum: 0
      description: >-
        One champion-and-lane aggregate over confirmed games. Rows are ordered by games descending,
        wins descending, championId ascending, then canonical lane order. Games equals wins plus
        losses.
    GuildRecordsResult:
      type: string
      enum: [WIN, LOSS, DRAW]
      description: Target-perspective result.
    GuildRecordsSide:
      type: string
      enum: [BLUE, RED]
    GuildRecordsStage:
      type: string
      enum: [SEMIFINAL_A, SEMIFINAL_B, FINAL]
    GuildRecordsLineup:
      type: object
      additionalProperties: false
      required: [displayName, lane, championId, isTarget]
      properties:
        displayName:
          type: string
          minLength: 1
        lane:
          $ref: '#/components/schemas/Lane'
        championId:
          oneOf:
            - $ref: '#/components/schemas/ChampionId'
            - type: 'null'
        isTarget:
          type: boolean
    GuildRecordsGameTarget:
      type: object
      additionalProperties: false
      required: [side, lane, championId, mmrBefore, mmrAfter]
      oneOf:
        - properties:
            mmrBefore:
              type: number
              format: double
            mmrAfter:
              type: number
              format: double
        - properties:
            mmrBefore:
              type: 'null'
            mmrAfter:
              type: 'null'
      properties:
        side:
          $ref: '#/components/schemas/GuildRecordsSide'
        lane:
          $ref: '#/components/schemas/Lane'
        championId:
          oneOf:
            - $ref: '#/components/schemas/ChampionId'
            - type: 'null'
        mmrBefore:
          oneOf:
            - type: number
              format: double
            - type: 'null'
        mmrAfter:
          oneOf:
            - type: number
              format: double
            - type: 'null'
      description: >-
        The target's confirmed participant projection. Champion is nullable when no trusted pick
        was stored; MMR values are null together when no applicable GAME_RESULT ledger exists.
    GuildRecordsGame:
      type: object
      additionalProperties: false
      required:
        - id
        - gameNumber
        - playedAt
        - winningSide
        - target
        - blueTeam
        - redTeam
        - blueBans
        - redBans
      properties:
        id:
          type: string
          format: uuid
        gameNumber:
          type: integer
          minimum: 1
          maximum: 5
        playedAt:
          type: string
          format: date-time
        winningSide:
          $ref: '#/components/schemas/GuildRecordsSide'
        target:
          $ref: '#/components/schemas/GuildRecordsGameTarget'
        blueTeam:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/GuildRecordsLineup'
        redTeam:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/GuildRecordsLineup'
        blueBans:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ChampionId'
        redBans:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/ChampionId'
    GuildRecordsSeriesSource:
      type: string
      enum: [REGULAR, AUCTION]
    GuildRecordsSeries:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - source
        - title
        - participantCount
        - playedAt
        - result
        - teamName
        - opponentName
        - stage
        - wins
        - losses
        - mmrDelta
        - games
      properties:
        kind:
          type: string
          const: SERIES
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/GuildRecordsSeriesSource'
        title:
          type: string
          minLength: 1
        participantCount:
          type: integer
          const: 10
        playedAt:
          type: string
          format: date-time
          description: Latest confirmed target game time in this series.
        result:
          $ref: '#/components/schemas/GuildRecordsResult'
        teamName:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        opponentName:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        stage:
          oneOf:
            - $ref: '#/components/schemas/GuildRecordsStage'
            - type: 'null'
        wins:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        mmrDelta:
          oneOf:
            - type: number
              format: double
            - type: 'null'
          description: >-
            Sum of every target game MMR delta, or null when any included game lacks the applicable
            GAME_RESULT ledger.
        games:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/GuildRecordsGame'
      description: >-
        A completed regular series or completed ten-person auction final. The games array length
        equals wins plus losses.
    GuildRecordsTournamentSeries:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - stage
        - opponentName
        - playedAt
        - result
        - wins
        - losses
        - mmrDelta
        - games
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        stage:
          $ref: '#/components/schemas/GuildRecordsStage'
        opponentName:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        playedAt:
          type: string
          format: date-time
          description: Latest confirmed target game time in this bracket series.
        result:
          $ref: '#/components/schemas/GuildRecordsResult'
        wins:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        mmrDelta:
          oneOf:
            - type: number
              format: double
            - type: 'null'
          description: >-
            Sum of every included target game MMR delta, or null when any game lacks the applicable
            GAME_RESULT ledger.
        games:
          type: array
          minItems: 1
          maxItems: 5
          items:
            $ref: '#/components/schemas/GuildRecordsGame'
      description: Games array length equals wins plus losses.
    GuildRecordsTournament:
      type: object
      additionalProperties: false
      required:
        - kind
        - id
        - title
        - participantCount
        - playedAt
        - teamName
        - spentPoints
        - placement
        - wins
        - losses
        - mmrDelta
        - roster
        - series
      properties:
        kind:
          type: string
          const: TOURNAMENT
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
        participantCount:
          type: integer
          const: 20
        playedAt:
          type: string
          format: date-time
          description: Latest confirmed target game time across the included bracket series.
        teamName:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
        spentPoints:
          oneOf:
            - type: integer
              minimum: 0
            - type: 'null'
        placement:
          oneOf:
            - type: integer
              enum: [1, 2, 3]
            - type: 'null'
        wins:
          type: integer
          minimum: 0
        losses:
          type: integer
          minimum: 0
        mmrDelta:
          oneOf:
            - type: number
              format: double
            - type: 'null'
        roster:
          type: array
          minItems: 5
          maxItems: 5
          items:
            $ref: '#/components/schemas/GuildRecordsLineup'
        series:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: '#/components/schemas/GuildRecordsTournamentSeries'
      description: >-
        One completed twenty-person auction tournament. Wins and losses aggregate the nested
        confirmed games; mmrDelta is null when any nested game lacks its applicable GAME_RESULT
        ledger.
    GuildRecordsRecord:
      oneOf:
        - $ref: '#/components/schemas/GuildRecordsSeries'
        - $ref: '#/components/schemas/GuildRecordsTournament'
      discriminator:
        propertyName: kind
        mapping:
          SERIES: '#/components/schemas/GuildRecordsSeries'
          TOURNAMENT: '#/components/schemas/GuildRecordsTournament'
    GuildRecordsSearchData:
      type: object
      additionalProperties: false
      required:
        - member
        - championPreferences
        - riotAccounts
        - seasons
        - selectedSeasonId
        - summary
        - laneMmr
        - championRecords
        - records
        - nextCursor
      properties:
        member:
          $ref: '#/components/schemas/GuildRecordsProfileMember'
        championPreferences:
          $ref: '#/components/schemas/ChampionPreferences'
        riotAccounts:
          type: array
          items:
            $ref: '#/components/schemas/GuildRecordsVisibleRiotAccount'
        seasons:
          type: array
          description: Active season first, followed by closed seasons in descending start order.
          items:
            $ref: '#/components/schemas/GuildRecordsSeason'
        selectedSeasonId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
        summary:
          $ref: '#/components/schemas/GuildRecordsSummary'
        laneMmr:
          type: array
          minItems: 5
          maxItems: 5
          description: Exactly TOP, JUNGLE, MID, BOTTOM, SUPPORT in canonical order.
          prefixItems:
            - allOf:
                - $ref: '#/components/schemas/GuildRecordsLaneMmr'
                - properties:
                    lane:
                      const: TOP
            - allOf:
                - $ref: '#/components/schemas/GuildRecordsLaneMmr'
                - properties:
                    lane:
                      const: JUNGLE
            - allOf:
                - $ref: '#/components/schemas/GuildRecordsLaneMmr'
                - properties:
                    lane:
                      const: MID
            - allOf:
                - $ref: '#/components/schemas/GuildRecordsLaneMmr'
                - properties:
                    lane:
                      const: BOTTOM
            - allOf:
                - $ref: '#/components/schemas/GuildRecordsLaneMmr'
                - properties:
                    lane:
                      const: SUPPORT
          items: false
        championRecords:
          type: array
          items:
            $ref: '#/components/schemas/GuildRecordsChampionRecord'
        records:
          type: array
          maxItems: 50
          description: >-
            Stable keyset page ordered by playedAt descending, id descending, then kind descending.
            Twenty-person tournament series are nested and never paginated as separate outer rows.
          items:
            $ref: '#/components/schemas/GuildRecordsRecord'
        nextCursor:
          oneOf:
            - $ref: '#/components/schemas/OpaquePageCursor'
            - type: 'null'
    GuildRecordsSearchResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/GuildRecordsSearchData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    GuildLeaderboardSeason:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
    GuildLeaderboardRoleStat:
      type: object
      additionalProperties: false
      required: [mmr, games, wins, championId]
      properties:
        mmr:
          type: number
          format: double
        games:
          type: integer
          format: int32
          minimum: 1
        wins:
          type: integer
          format: int32
          minimum: 0
        championId:
          oneOf:
            - $ref: '#/components/schemas/ChampionId'
            - type: 'null'
      description: >-
        One played lane from user_lane_mmr. Wins never exceeds games. championId is the
        most-played champion in confirmed games under non-cancelled, non-deleted regular-series or
        auction parents; ties use champion ID ascending. It is null when no qualifying champion
        pick exists.
    GuildLeaderboardStats:
      type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 5
      description: >-
        Partial canonical-lane object. A lane is present only when its games_played value is at
        least one.
      properties:
        TOP:
          $ref: '#/components/schemas/GuildLeaderboardRoleStat'
        JUNGLE:
          $ref: '#/components/schemas/GuildLeaderboardRoleStat'
        MID:
          $ref: '#/components/schemas/GuildLeaderboardRoleStat'
        BOTTOM:
          $ref: '#/components/schemas/GuildLeaderboardRoleStat'
        SUPPORT:
          $ref: '#/components/schemas/GuildLeaderboardRoleStat'
    GuildLeaderboardPlayer:
      type: object
      additionalProperties: false
      required: [id, name, tag, profileIconId, compositeMmr, mainRole, isMe, stats]
      properties:
        id:
          $ref: '#/components/schemas/UserIdentifier'
        name:
          type: string
          minLength: 1
        tag:
          oneOf:
            - type: string
              minLength: 1
            - type: 'null'
          description: Main Riot ID as GameName#TagLine, or null when show_riot_ids is not true.
        profileIconId:
          oneOf:
            - type: integer
              format: int32
              minimum: 0
            - type: 'null'
          description: Main Riot account profile icon, or null when show_riot_ids is not true.
        compositeMmr:
          type: number
          format: double
          description: >-
            Exact unrounded SUM(lane MMR * games played) / SUM(games played) over every returned
            lane stat.
        mainRole:
          $ref: '#/components/schemas/Lane'
          description: >-
            A played configured main lane when available; otherwise highest games, then highest
            MMR, then canonical lane order.
        isMe:
          type: boolean
        stats:
          $ref: '#/components/schemas/GuildLeaderboardStats'
    GuildLeaderboardWithoutSeasonData:
      type: object
      additionalProperties: false
      required: [season, players]
      properties:
        season:
          type: 'null'
        players:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/GuildLeaderboardPlayer'
    GuildLeaderboardActiveSeasonData:
      type: object
      additionalProperties: false
      required: [season, players]
      properties:
        season:
          $ref: '#/components/schemas/GuildLeaderboardSeason'
        players:
          type: array
          description: >-
            Active members with at least one played lane. Player IDs are unique and at most one
            entry has isMe=true.
          items:
            $ref: '#/components/schemas/GuildLeaderboardPlayer'
    GuildLeaderboardData:
      oneOf:
        - $ref: '#/components/schemas/GuildLeaderboardWithoutSeasonData'
        - $ref: '#/components/schemas/GuildLeaderboardActiveSeasonData'
