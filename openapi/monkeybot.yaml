          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: resetServiceAdminGuildRecords
      summary: Reset every workflow and history row for a development guild
      description: >-
        Requires a service-admin session, the non-production development-tools flag, exact CSRF,
        a UUID Idempotency-Key, and the confirmation returned by GET. Guild operator membership is
        deliberately not required. In one transaction it removes seasons, recruitments, series,
        games, MMR, auction workflows, import jobs, workflow audit/outbox/idempotency rows, then
        creates one empty active season and resets all four display counters. Guild membership,
        settings, Discord catalog, Riot accounts, and user preferences are preserved.
      security:
        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/GuildId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuildRecordResetCommand'
      responses:
        '200':
          description: Authoritative deletion counts and fresh active season.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuildRecordResetResultResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /healthz:
    get:
      operationId: getLiveness
      summary: Process liveness
      responses:
        '200':
          description: The API process is alive.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LivenessResponse'
  /readyz:
    get:
      operationId: getReadiness
      summary: Required dependency readiness
      responses:
        '200':
          description: PostgreSQL and migration version are ready. Valkey may be degraded.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          description: PostgreSQL or migration readiness is unavailable.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    BotBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
      description: >-
        Bot service-principal credential. It is independent from Discord bot tokens and browser
        session cookies and is compared against the configured backend secret.
    SessionCookie:
      type: apiKey
      in: cookie
      name: monkeybot_session
      description: Opaque host-only session token. The database stores only its SHA-256 hash.
    CsrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >-
        Required for unsafe browser methods and must exactly match the readable monkeybot_csrf
        cookie. Origin validation is applied independently.
  parameters:
    GuildId:
      name: guildId
      in: path
      required: true
      description: Discord guild snowflake encoded as a JSON/URL string.
      schema:
        $ref: '#/components/schemas/DiscordSnowflake'
    DiscordUserId:
      name: discordId
      in: path
      required: true
      description: Canonical Discord user snowflake. Display names are never identity keys.
      schema:
        $ref: '#/components/schemas/DiscordSnowflake'
    RecruitmentId:
      name: recruitmentId
      in: path
      required: true
      description: Recruitment root UUID. It is not the guild-local display number.
      schema:
        type: string
        format: uuid
    AuctionRecruitmentId:
      name: auctionRecruitmentId
      in: path
      required: true
      description: Auction recruitment root UUID. It is not the guild-local display number.
      schema:
        type: string
        format: uuid
    AuctionTournamentId:
      name: auctionTournamentId
      in: path
      required: true
      description: Auction tournament root UUID. It is not the guild-local display number.
      schema:
        type: string
        format: uuid
    SeriesId:
      name: seriesId
      in: path
      required: true
      description: General-series root UUID. It is not the guild-local display number.
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      description: Opaque stored user identifier. It can identify a Discord or development dummy user.
      schema:
        $ref: '#/components/schemas/UserIdentifier'
    MemberId:
      name: memberId
      in: path
      required: true
      description: Opaque stored user identifier for the guild member being administered.
      schema:
        $ref: '#/components/schemas/UserIdentifier'
    DummyUserId:
      name: userId
      in: path
      required: true
      description: Development dummy user identifier generated by the backend.
      schema:
        $ref: '#/components/schemas/DummyUserIdentifier'
    DummyGroupId:
      name: groupId
      in: path
      required: true
      description: Persistent dummy-user group UUID.
      schema:
        type: string
        format: uuid
    ChampionPreferenceLane:
      name: lane
      in: path
      required: true
      description: Canonical lane whose ordered champion preferences are replaced.
      schema:
        $ref: '#/components/schemas/Lane'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Discord interaction ID. Reuse with an identical route and request replays the stored
        response; reuse with a different request returns idempotency_conflict.
      schema:
        $ref: '#/components/schemas/DiscordSnowflake'
    BrowserIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Browser-generated key for a user-initiated unsafe command; UUIDv4 is recommended and used
        by the web client. Reuse with an identical route and request replays the stored response;
        reuse with a different request returns idempotency_conflict. This is distinct from a Bot
        command's Discord interaction ID.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
      example: 2c26bd12-cfdd-4d13-b5b2-17c6db65c7f1
    RecruitmentCreateIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        General and auction recruitment Bot requests use the Discord interaction ID. Browser
        requests use a visible ASCII key up to 128 bytes. Reuse with the identical authenticated
        principal and request replays the stored response; a changed request returns
        idempotency_conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
    RecruitmentMemberIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >-
        Bot requests use the Discord interaction ID. Browser operator requests use a visible
        ASCII key up to 128 bytes. Reuse with the identical authenticated principal and request
        replays the stored response; a changed request returns idempotency_conflict.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[!-~]+$'
    ActionableState:
      name: state
      in: query
      required: true
      description: Select the actionable projection.
      schema:
        type: string
        const: actionable
    ActiveCompletedState:
      name: state
      in: query
      required: true
      description: Select active work or completed results.
      schema:
        type: string
        enum: [active, completed]
    AuctionTournamentSeasonId:
      name: seasonId
      in: query
      required: false
      description: Optional canonical season UUID that restricts the auction tournament list.
      schema:
        type: string
        format: uuid
    PageCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque URL-safe cursor returned as nextCursor by the same endpoint and state query. Clients
        must not inspect or construct its contents.
      schema:
        type: string
        minLength: 1
    PageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of rows to return. Defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    SearchSuggestionQuery:
      name: q
      in: query
      required: true
      description: Prefix used by navbar autocomplete after endpoint-specific normalization.
      schema:
        type: string
        minLength: 2
    SearchSuggestionLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of suggestions to return.
      schema:
        type: integer
        minimum: 1
        maximum: 8
        default: 8
    GuildRecordsProfileQuery:
      name: q
      in: query
      required: true
      description: >-
        Exact stored UserIdentifier, guild display name, or full GameName#TagLine. Leading and
        trailing whitespace is removed. Display names are matched case-insensitively; Riot IDs use
        the canonical NFKC, trim, and Unicode case-fold normalization.
      schema:
        type: string
        minLength: 1
        maxLength: 100
      examples:
        displayName:
          value: Longcat
        riotId:
          value: Longcat#KR1
        discordId:
          value: '1525847677542207548'
        dummyUserId:
          value: dmy_01900000-0000-7000-8000-000000000001
    GuildRecordsSeasonId:
      name: seasonId
      in: query
      required: false
      description: >-
        Guild-owned season UUID to select. When omitted, the active season is selected. If the
        guild has no active season, selectedSeasonId is null even when closed seasons exist. An
        unknown or foreign-guild UUID returns 404.
      schema:
        type: string
        format: uuid
    GuildRecordsPageCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Opaque canonical URL-safe cursor returned by this endpoint. It represents the last
        (playedAt, id, kind) tuple and must be reused with the same q and seasonId selection.
      schema:
        $ref: '#/components/schemas/OpaquePageCursor'
    GuildRecordsPageLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of SERIES or TOURNAMENT groups to return. Defaults to 20.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    RiotGameName:
      name: gameName
      in: query
      required: true
      description: Human-facing Riot game name without the `#` separator.
      schema:
        $ref: '#/components/schemas/RiotGameName'
      example: Longcat
    RiotTagLine:
      name: tagLine
      in: query
      required: true
      description: Human-facing Riot tag line without the `#` separator.
      schema:
        $ref: '#/components/schemas/RiotTagLine'
      example: KR1
    RiotPlatformQuery:
      name: platform
      in: query
      required: true
      description: Riot platform routing code. The MVP allowlist contains KR only.
      schema:
        $ref: '#/components/schemas/RiotPlatform'
    RiotPuuid:
      name: puuid
      in: path
      required: true
      description: Opaque PUUID previously resolved and stored by the backend.
      schema:
        $ref: '#/components/schemas/RiotPuuidValue'
  headers:
    RequestId:
      description: Backend-generated UUIDv7 request identifier.
      schema:
        type: string
        format: uuid
    RedirectLocation:
      description: Absolute external authorization URL or allowlisted same-origin application URL.
      schema:
        type: string
        format: uri-reference
    OAuthStateCookie:
      description: >-
        `monkeybot_oauth_state`; host-only, HttpOnly, Secure, SameSite=Lax,
        Path=/oauth/callback, Max-Age=300.
      schema:
        type: string
        example: monkeybot_oauth_state=opaque; Path=/oauth/callback; Max-Age=300; Secure; HttpOnly; SameSite=Lax
    AuthenticatedSessionCookies:
      description: >-
        Three separate Set-Cookie fields: `monkeybot_session` (host-only, HttpOnly, Secure,
        SameSite=Lax, Path=/), `monkeybot_csrf` (host-only, Secure, SameSite=Lax, Path=/; readable
        by the browser client), and `monkeybot_oauth_state` expired with Path=/oauth/callback.
        They must not be folded into one comma-separated field.
      schema:
        type: array
        items:
          type: string
    ClearedSessionCookies:
      description: >-
        Two separate Set-Cookie fields that expire `monkeybot_session` and `monkeybot_csrf` with
        Path=/ and Max-Age=0. They must not be folded into one comma-separated field.
      schema:
        type: array
        items:
          type: string
  responses:
    BadRequest:
      description: Invalid query, path, body, OAuth state, or OAuth callback shape.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: >-
        Browser session or Bot bearer authentication is absent, invalid, expired, or revoked for
        the requested principal type.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: CSRF or Origin validation failed, or the principal lacks the required role.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found, including a resource hidden by tenant isolation.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Revision, state, idempotency, or ambiguous exact-identity lookup conflict.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Domain invariant violation such as capacity, membership, or required lanes.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required dependency is temporarily unavailable.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadGateway:
      description: An authenticated upstream provider timed out, rejected the request, or returned invalid data.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: >-
        A local route limit or upstream provider limit was exceeded. When supplied by the provider,
        error.details.retryAfterSeconds contains the non-negative retry delay.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: An internal invariant, stored-data, or programming error occurred.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
