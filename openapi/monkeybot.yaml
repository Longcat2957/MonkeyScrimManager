      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SeriesPickBanSnapshot'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SeriesLifecycleData:
      type: object
      additionalProperties: false
      required: [nextHref]
      properties:
