      description: >-
        Archive is a profile lifecycle state, not account deletion, so users.deleted_at remains
        null and historical projections remain readable. The command is rejected while the user
        is JOINED to any OPEN or CLOSED general or auction recruitment. On success, every ACTIVE
        guild membership is changed to INACTIVE and each affected guild's MEMBERS revision and
        MEMBER_STATUS_CHANGED audit entry are committed in the same transaction. The admin
        members resource has no WebSocket topic, so this command does not create an invalidate
        outbox event.
