        allowExternalRecordSearch:
          type: boolean
          description: >-
            Whether users outside the target guild may access this user's custom-match records in
            a public guild. This does not restrict same-guild records or public Riot records.
    PrivacySettingsData:
      type: object
      additionalProperties: false
