        - SessionCookie: []
          CsrfHeader: []
      parameters:
        - $ref: '#/components/parameters/DummyUserId'
        - $ref: '#/components/parameters/BrowserIdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
