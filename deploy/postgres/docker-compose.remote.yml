name: monkeybot-infra

services:
  postgres:
    image: postgres:18.4-alpine3.23
    container_name: monkeybot-postgres
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    ports:
      - '127.0.0.1:10010:5432'
    shm_size: 256mb
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      data:
        aliases:
          - postgres
      tunnel:
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres-data:
    name: monkeybot-postgres-data

networks:
  data:
    name: deploy_data
    internal: true
  tunnel:
    name: monkeybot_tunnel
