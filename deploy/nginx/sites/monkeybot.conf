upstream monkeybot_frontend_main {
    server monkeybot-web-main:3002;
}

upstream monkeybot_backend_main {
    server monkeybot-api-main:8080;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name monkeybot.lol;

    ssl_certificate     /etc/nginx/certs/monkeybot-origin.pem;
    ssl_certificate_key /etc/nginx/certs/monkeybot-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/monkeybot.access.log;
    error_log  /var/log/nginx/monkeybot.error.log;

    client_max_body_size 16m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://monkeybot_backend_main;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Authorization codes are query parameters and must not enter nginx access logs.
    location = /oauth/callback {
        access_log off;
        proxy_pass http://monkeybot_backend_main;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /oauth/ {
        proxy_pass http://monkeybot_backend_main;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /ws {
        proxy_pass http://monkeybot_backend_main;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://monkeybot_frontend_main;
        proxy_http_version 1.1;
        # SvelteKit can emit a large Link header for module preloads.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
