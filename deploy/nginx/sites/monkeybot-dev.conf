upstream monkeybot_frontend_dev {
    server monkeybot-web-dev:3002;
}

upstream monkeybot_backend_dev {
    server api-dev:8080;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name dev.monkeybot.lol;

    ssl_certificate     /etc/nginx/certs/monkeybot-origin.pem;
    ssl_certificate_key /etc/nginx/certs/monkeybot-origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/monkeybot-dev.access.log;
    error_log  /var/log/nginx/monkeybot-dev.error.log;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The frontend proxies this route to Axum; never log the OAuth code query parameter.
    location = /oauth/callback {
        access_log off;
        proxy_pass http://monkeybot_frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Entry drafting uses a same-origin WebSocket; keep it out of the SvelteKit HTTP proxy.
    location = /ws {
        proxy_pass http://monkeybot_backend_dev;
        include /etc/nginx/conf.d/proxy-websocket.inc;
    }

    location / {
        proxy_pass http://monkeybot_frontend_dev;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
