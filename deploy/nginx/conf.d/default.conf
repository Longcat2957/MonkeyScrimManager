# Cloudflare proxy ranges. Refresh when Cloudflare changes its published ranges.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

upstream frontend_main {
    server host.docker.internal:20010;
}

upstream backend_main {
    server host.docker.internal:20020;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 444;
}

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name monkeybot.lol;

    ssl_certificate     /etc/nginx/certs/origin.pem;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/monkeybot-main.access.log;
    error_log  /var/log/nginx/monkeybot-main.error.log;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://backend_main;
        include /etc/nginx/conf.d/proxy-http.inc;
    }

    # Authorization codes are query parameters and must not enter nginx access logs.
    location = /oauth/callback {
        access_log off;
        proxy_pass http://backend_main;
        include /etc/nginx/conf.d/proxy-http.inc;
    }

    location /oauth/ {
        proxy_pass http://backend_main;
        include /etc/nginx/conf.d/proxy-http.inc;
    }

    location /ws {
        proxy_pass http://backend_main;
        include /etc/nginx/conf.d/proxy-websocket.inc;
    }

    location / {
        proxy_pass http://frontend_main;
        include /etc/nginx/conf.d/proxy-http.inc;
    }
}
