# Migration candidate only. No main/dev upstreams are replaced by this Compose project.
name: monkeybot-fastapi-candidate
services:
  api:
    image: ${MONKEYBOT_FASTAPI_IMAGE:-monkeybot-api-python}:${MONKEYBOT_FASTAPI_TAG:-candidate}
    build:
      context: ..
      dockerfile: apps/api-python/Dockerfile
      args:
        REVISION: ${MONKEYBOT_FASTAPI_REVISION:-working-tree}
    env_file:
      - path: ${MONKEYBOT_FASTAPI_RUNTIME_ENV:?set candidate runtime env file}
        required: true
    environment:
      MONKEYBOT_BIND_ADDR: 0.0.0.0:8080
    ports:
      - 127.0.0.1:${MONKEYBOT_FASTAPI_PORT:-30022}:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    mem_limit: 512m
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
