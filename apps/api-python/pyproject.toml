[project]
name = "monkeybot-api-python"
version = "0.1.0"
description = "Incremental FastAPI replacement for the MonkeyBot API"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3",
  "pydantic>=2.7,<3",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "redis>=5,<8",
  "httpx>=0.28,<1",
  "cryptography>=44,<50",
]

[project.scripts]
monkeybot-api-python = "monkeybot_api.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.11,<1",
  "mypy>=1.15,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monkeybot_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["postgres: requires the dedicated migrated PostgreSQL test database"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.14"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "asyncpg.*"
ignore_missing_imports = true
